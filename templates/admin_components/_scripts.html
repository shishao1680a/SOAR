<!-- Application Logic JavaScript -->
<script>
  const dataLoaded = { users: false, products: false, materials: false, lineGroups: false, bulletins: false, orders: false, bonuses: false };

  document.addEventListener("DOMContentLoaded", () => {
    // 儀表板不需預載資料；進入各分頁時才 lazy load，減少進入後台的請求數
  });

  // 頁籤 Tab 切換選單
  function switchProductSubTab(subTabId) {
    ['products', 'inventory', 'materials'].forEach(tab => {
      const contentEl = document.getElementById(`prod-subtab-${tab}`);
      const btnEl = document.getElementById(`prod-tab-${tab}`);
      if (contentEl) contentEl.classList.add('hidden');
      if (btnEl) {
        btnEl.className = "px-5 py-3 font-bold italic border-b-4 border-transparent text-gray-400 hover:text-white hover:bg-surface-container transition-all flex items-center gap-2";
      }
    });

    const activeContent = document.getElementById(`prod-subtab-${subTabId}`);
    const activeBtn = document.getElementById(`prod-tab-${subTabId}`);
    if (activeContent) activeContent.classList.remove('hidden');
    if (activeBtn) {
      if (subTabId === 'products') {
        activeBtn.className = "px-5 py-3 font-bold italic border-b-4 border-primary-fixed text-primary-fixed bg-surface-container-high transition-all flex items-center gap-2";
      } else if (subTabId === 'inventory') {
        activeBtn.className = "px-5 py-3 font-bold italic border-b-4 border-secondary-container text-secondary-container bg-surface-container-high transition-all flex items-center gap-2";
      } else if (subTabId === 'materials') {
        activeBtn.className = "px-5 py-3 font-bold italic border-b-4 border-cyan-400 text-cyan-400 bg-surface-container-high transition-all flex items-center gap-2";
      }
    }
  }

  function switchAdminSection(secId) {
    ['dashboard', 'users', 'products', 'orders', 'bonuses', 'line-groups', 'line-send', 'bulletins'].forEach(s => {
      const sec = document.getElementById(`sec-${s}`);
      if (sec) sec.classList.add('hidden');
      const sideBtn = document.getElementById(`side-${s}`);
      if (sideBtn) {
        sideBtn.className = "w-full text-left p-3 rounded font-bold italic flex items-center gap-2 text-on-surface-variant hover:bg-surface-container hover:text-white transition-colors";
      }
    });

    const activeSec = document.getElementById(`sec-${secId}`);
    if (activeSec) activeSec.classList.remove('hidden');
    const activeBtn = document.getElementById(`side-${secId}`);
    if (activeBtn) {
      activeBtn.className = "w-full text-left p-3 rounded font-bold italic flex items-center gap-2 bg-primary-fixed text-on-primary-fixed";
    }

    if (secId === 'users' && !dataLoaded.users) {
      dataLoaded.users = true;
      loadUsers();
    } else if (secId === 'products') {
      if (!dataLoaded.products) {
        dataLoaded.products = true;
        loadProducts();
      }
      loadMaterialUnitCosts();
      if (!dataLoaded.materials) {
        dataLoaded.materials = true;
        loadMaterialPurchases();
      }
    } else if (secId === 'orders' && !dataLoaded.orders) {
      dataLoaded.orders = true;
      loadAdminOrdersList();
    } else if (secId === 'bonuses' && !dataLoaded.bonuses) {
      dataLoaded.bonuses = true;
      defaultBonusRange();
      loadBonusSummary();
    } else if ((secId === 'line-groups' || secId === 'line-send') && !dataLoaded.lineGroups) {
      dataLoaded.lineGroups = true;
      loadLineGroups();
    } else if (secId === 'bulletins' && !dataLoaded.bulletins) {
      dataLoaded.bulletins = true;
      loadBulletins();
    }
  }

  function closeModal(modalId) {
    document.getElementById(modalId).classList.add('hidden');
  }

  // --- Member Management Logic ---
  let usersList = [];
  async function loadUsers() {
    try {
      const res = await fetch('/api/admin/users');
      const json = await res.json();
      if (json.status === 'success') {
        usersList = json.data;
        renderUsersTable();
      }
    } catch(e) { console.error(e); }
  }

  function renderUsersTable() {
    const tbody = document.getElementById('user-table-body');
    const roleMap = {
      admin: { label: '👑 最高管理員', style: 'bg-primary-fixed text-on-primary-fixed' },
      assistant_coach: { label: '🧢 助理教練', style: 'bg-secondary-container text-white' },
      user: { label: '🏃 一般使用者', style: 'bg-surface-container text-on-surface-variant' }
    };

    tbody.innerHTML = usersList.map(u => {
      const r = roleMap[u.role] || roleMap.user;
      return `
        <tr class="hover:bg-surface-container/50">
          <td class="p-3 flex items-center gap-2">
            <img src="${u.avatar_url}" class="w-7 h-7 rounded-full border border-primary-fixed" />
            <span class="font-bold text-white">${u.name}</span>
          </td>
          <td class="p-3 text-primary-fixed font-bold">${u.username || '-'}</td>
          <td class="p-3 text-line-green">${u.line_id || '-'}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 ${r.style} rounded font-bold">
              ${r.label}
            </span>
          </td>
          <td class="p-3">${u.phone || '-'}</td>
          <td class="p-3 text-on-surface-variant text-[11px]">${u.register_date || '-'}</td>
          <td class="p-3 text-right">
            <button onclick="editUser('${u.id}')" class="text-primary-fixed hover:underline mr-2">編輯</button>
            <button onclick="deleteUser('${u.id}')" class="text-error hover:underline">刪除</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function openUserModal(u = null) {
    document.getElementById('user-edit-id').value = u ? u.id : '';
    document.getElementById('user-edit-name').value = u ? u.name : '';
    document.getElementById('user-edit-username').value = u ? (u.username || '') : '';
    document.getElementById('user-edit-password').value = '';
    document.getElementById('user-edit-lineid').value = u ? (u.line_id || '') : '';
    document.getElementById('user-edit-role').value = u ? u.role : 'member';
    document.getElementById('modal-user').classList.remove('hidden');
  }

  function editUser(id) {
    const u = usersList.find(item => item.id === id);
    if (u) openUserModal(u);
  }

  async function saveUserSubmit() {
    const payload = {
      id: document.getElementById('user-edit-id').value,
      name: document.getElementById('user-edit-name').value.trim(),
      username: document.getElementById('user-edit-username').value.trim(),
      password: document.getElementById('user-edit-password').value.trim(),
      line_id: document.getElementById('user-edit-lineid').value.trim(),
      role: document.getElementById('user-edit-role').value
    };

    const res = await fetch('/api/admin/users', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.status === 'success') {
      alert('成員資料更新成功！');
      closeModal('modal-user');
      loadUsers();
    } else { alert(json.message); }
  }

  async function deleteUser(id) {
    if (!confirm('確定要刪除此成員嗎？')) return;
    const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
    const json = await res.json();
    if (json.status === 'success') { loadUsers(); }
  }

  // --- Product & Inventory Logic ---
  let productsList = [];
  let currentProductItems = [];

  async function loadProducts() {
    try {
      await loadProductOptions();
      const res = await fetch('/api/products');
      const json = await res.json();
      if (json.status === 'success') {
        productsList = json.data;
        await loadInventoryLogs();
        renderProductsTable();
        updateInventorySelect();
      }
    } catch(e) { console.error(e); }
  }

  async function loadProductOptions() {
    try {
      const res = await fetch('/api/product-options');
      const json = await res.json();
      if (json.status === 'success') {
        const catSelect = document.getElementById('prod-edit-category');
        const matSelect = document.getElementById('prod-edit-material');
        
        const defaultCats = [
          { code: '3d-print', name: '3D列印套件 (3d-print)' },
          { code: 'uv-print', name: 'UV炫彩作品 (uv-print)' },
          { code: 'custom', name: '社團限定 (custom)' }
        ];
        const defaultMats = [
          { code: 'TPU_95A', name: 'TPU_95A' },
          { code: 'PLA_PRO', name: 'PLA_PRO' },
          { code: 'NYLON_CF', name: 'NYLON_CF' },
          { code: 'UV_RESIN', name: 'UV_RESIN' }
        ];

        const allCats = [...defaultCats];
        (json.categories || []).forEach(c => {
          if (!allCats.some(x => x.code === c.code)) allCats.push(c);
        });
        const allMats = [...defaultMats];
        (json.materials || []).forEach(m => {
          if (!allMats.some(x => x.code === m.code)) allMats.push(m);
        });

        catSelect.innerHTML = allCats.map(c => `<option value="${c.code}">${c.name}</option>`).join('');
        matSelect.innerHTML = allMats.map(m => `<option value="${m.code}">${m.name}</option>`).join('');
      }
    } catch(e){}
  }

  async function promptAddCategory() {
    const name = prompt('請輸入新分類名稱 (例如：車架升級套件、競賽級護具):');
    if (!name || !name.trim()) return;
    const res = await fetch('/api/admin/product-options/category', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name.trim() })
    });
    const json = await res.json();
    if (json.status === 'success') {
      alert('分類新增成功！');
      await loadProductOptions();
      document.getElementById('prod-edit-category').value = json.code;
    } else { alert(json.message); }
  }

  async function promptAddMaterial() {
    const name = prompt('請輸入新材質等級/小分類名稱 (例如：TPU_95A_PRO、CARBON_FIBER):');
    if (!name || !name.trim()) return;
    const res = await fetch('/api/admin/product-options/material', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name.trim() })
    });
    const json = await res.json();
    if (json.status === 'success') {
      alert('材質等級/小分類新增成功！');
      await loadProductOptions();
      document.getElementById('prod-edit-material').value = json.code;
    } else { alert(json.message); }
  }

  let inventoryLogsList = [];

  function calcCalculatedStock(prodId, itemName) {
    if (!inventoryLogsList || inventoryLogsList.length === 0) return 0;
    const prod = productsList.find(p => String(p.id).trim() === String(prodId).trim());
    const prodName = prod ? prod.name.trim() : '';
    let purchased = 0;

    inventoryLogsList.forEach(log => {
      const logProdId = log.product_id ? String(log.product_id).trim() : '';
      const logProdName = log.product_name ? String(log.product_name).trim() : '';

      const matchesProduct = (logProdId && logProdId === String(prodId).trim()) ||
                             (logProdName && prodName && logProdName === prodName);

      if (matchesProduct) {
        const logItem = (log.item_name || '-').trim();
        const targetItem = (itemName || '-').trim();
        
        if (targetItem === '-') {
          purchased += parseInt(log.purchase_qty || 0);
        } else {
          if (logItem === targetItem || logItem === '-' || logItem === '-- 全品項預設/主商品 --') {
            purchased += parseInt(log.purchase_qty || 0);
          }
        }
      }
    });
    let sold = 0;
    return Math.max(0, purchased - sold);
  }

  function renderProductsTable() {
    const tbody = document.getElementById('product-table-body');
    tbody.innerHTML = productsList.map(p => {
      let multiImgs = [];
      let itemsArr = [];
      try { multiImgs = JSON.parse(p.images_json || '[]'); } catch(e){}
      try {
        itemsArr = typeof p.items_json === 'string' ? JSON.parse(p.items_json || '[]') : (p.items_json || []);
      } catch(e){ itemsArr = []; }

      const hasItems = itemsArr && itemsArr.length > 0;

      const itemsNameHtml = hasItems
        ? itemsArr.map(item => `
            <div class="flex items-center gap-1.5 bg-surface-container-high/90 px-2.5 py-1 rounded border border-outline-variant/60 whitespace-nowrap mb-1">
              ${item.image_url ? `<img src="${item.image_url}" class="w-4 h-4 object-cover rounded border border-outline-variant shrink-0" />` : '<span class="material-symbols-outlined text-[12px] text-line-green shrink-0">tune</span>'}
              <span class="font-bold text-white text-[11px]">${item.name}</span>
            </div>
          `).join('')
        : `<span class="text-gray-400 italic text-[11px]">- (無項目)</span>`;

      const itemsPriceHtml = hasItems
        ? itemsArr.map(item => `
            <div class="py-1 text-primary-fixed font-bold font-mono text-[11px] mb-1">
              $${parseFloat(item.price !== undefined ? item.price : p.price).toFixed(2)}
            </div>
          `).join('')
        : `<span class="text-primary-fixed font-bold font-mono">$${parseFloat(p.price).toFixed(2)}</span>`;

      const itemsStockHtml = hasItems
        ? itemsArr.map(item => {
            const qty = calcCalculatedStock(p.id, item.name);
            return `
              <div class="py-1 font-bold font-mono text-[11px] mb-1 ${qty < 10 ? 'text-error' : 'text-line-green'}">
                ${qty} 件
              </div>
            `;
          }).join('')
        : `<span class="font-bold ${calcCalculatedStock(p.id, '-') < 10 ? 'text-error' : 'text-line-green'}">${calcCalculatedStock(p.id, '-')} 件</span>`;

      return `
        <tr class="hover:bg-surface-container/50">
          <td class="p-3">
            <div class="flex items-center gap-1">
              <img src="${p.image_url}" class="w-10 h-10 object-cover border border-outline-variant rounded" />
              ${multiImgs.length > 1 ? `<span class="text-[10px] bg-secondary-container text-white px-1 font-bold rounded">+${multiImgs.length - 1}圖</span>` : ''}
            </div>
          </td>
          <td class="p-3 font-bold text-white whitespace-nowrap">
            ${p.name}
            ${hasItems ? `<span class="block text-[10px] text-gray-400 font-normal">(${itemsArr.length} 個項目)</span>` : ''}
          </td>
          <td class="p-3"><span class="text-primary-fixed">${p.category}</span> / ${p.material}</td>
          <td class="p-3">
            <div class="max-w-[200px] space-y-1">
              ${itemsNameHtml}
            </div>
          </td>
          <td class="p-3">${itemsPriceHtml}</td>
          <td class="p-3">${itemsStockHtml}</td>
          <td class="p-3 text-right whitespace-nowrap">
            <button onclick="editProduct('${p.id}')" class="text-primary-fixed hover:underline mr-2 font-bold">編輯</button>
            <button onclick="deleteProduct('${p.id}')" class="text-error hover:underline font-bold">下架</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function updateSubItemImagePreview() {
    const url = document.getElementById('item-edit-image').value.trim();
    const previewBox = document.getElementById('item-edit-preview-box');
    const previewImg = document.getElementById('item-edit-img-preview');
    if (url) {
      previewImg.src = url;
      previewBox.classList.remove('hidden');
    } else {
      previewBox.classList.add('hidden');
    }
  }

  function renderProductItemsList() {
    const container = document.getElementById('product-items-list-container');
    if (!container) return;

    if (currentProductItems.length === 0) {
      container.innerHTML = `
        <div class="text-center p-4 text-xs text-gray-400 italic bg-surface-container/40 rounded-lg border border-dashed border-outline-variant/60">
          目前尚無項目規格。點擊右上角【+ 新增項目】跳出視窗即可新增不同款式 (例: 黑色-HELLO純棉款)。
        </div>
      `;
      return;
    }

    container.innerHTML = currentProductItems.map((item, index) => `
      <div class="flex items-center justify-between p-3 bg-surface-container border border-outline-variant rounded-lg hover:border-line-green/60 transition-all gap-2">
        <div class="flex items-center gap-3 overflow-hidden">
          <img src="${item.image_url || 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=150&q=80'}" class="w-10 h-10 object-cover rounded border border-outline-variant shrink-0" />
          <div class="truncate">
            <div class="font-bold text-white text-xs truncate flex items-center gap-1">
              <span class="text-line-green font-mono text-[11px]">#${index + 1}</span> ${item.name || '未命名項目'}
            </div>
            <div class="text-[11px] text-gray-300 font-mono mt-0.5">
              售價: <span class="text-primary-fixed font-bold">$${parseFloat(item.price !== undefined ? item.price : 0).toFixed(2)}</span>
            </div>
          </div>
        </div>
        <div class="flex gap-1.5 shrink-0">
          <button type="button" onclick="openProductItemModal(${index})" class="px-2.5 py-1 bg-primary-fixed/20 text-primary-fixed hover:bg-primary-fixed hover:text-black font-bold text-xs rounded transition-all border border-primary-fixed/30 flex items-center gap-1">
            <span class="material-symbols-outlined text-xs">edit</span> 編輯
          </button>
          <button type="button" onclick="removeProductItem(${index})" class="px-2 py-1 bg-error/20 text-error hover:bg-error hover:text-white font-bold text-xs rounded transition-all flex items-center gap-0.5">
            ✕ 刪除
          </button>
        </div>
      </div>
    `).join('');
  }

  function addProductItem() {
    openProductItemModal(-1);
  }

  function openProductItemModal(index = -1) {
    const titleEl = document.getElementById('item-modal-title');
    document.getElementById('item-edit-index').value = index;

    if (index === -1) {
      if (titleEl) titleEl.innerHTML = `<span class="material-symbols-outlined text-line-green text-lg">add_circle</span> 新增項目規格`;
      setVal('item-edit-name', `款式 #${currentProductItems.length + 1}`);
      setVal('item-edit-price', document.getElementById('prod-edit-price').value || '45.00');
      setVal('item-edit-cost', document.getElementById('prod-edit-cost').value || '18.00');
      setVal('item-edit-uv-cost', document.getElementById('prod-edit-uv-cost').value || '5.00');
      setVal('item-edit-image', document.getElementById('prod-edit-image').value || '');
      setVal('item-edit-designer-ratio', document.getElementById('prod-edit-designer-ratio').value || 20);
      setVal('item-edit-packager-ratio', document.getElementById('prod-edit-packager-ratio').value || 60);
      setVal('item-edit-platform-ratio', document.getElementById('prod-edit-platform-ratio').value || 20);
    } else {
      const item = currentProductItems[index];
      if (titleEl) titleEl.innerHTML = `<span class="material-symbols-outlined text-line-green text-lg">edit_note</span> 編輯項目規格 #${index + 1}`;
      setVal('item-edit-name', item ? item.name : '');
      setVal('item-edit-price', item ? item.price : 0);
      setVal('item-edit-cost', item ? item.cost_price : 0);
      setVal('item-edit-uv-cost', item ? item.uv_cost_price : 0);
      setVal('item-edit-image', item ? item.image_url : '');
      setVal('item-edit-designer-ratio', item ? (item.designer_ratio !== undefined ? item.designer_ratio : 20) : 20);
      setVal('item-edit-packager-ratio', item ? (item.packager_ratio !== undefined ? item.packager_ratio : 60) : 60);
      setVal('item-edit-platform-ratio', item ? (item.platform_ratio !== undefined ? item.platform_ratio : 20) : 20);
    }

    updateSubItemImagePreview();

    const subModal = document.getElementById('modal-product-item');
    if (subModal) subModal.classList.remove('hidden');
  }

  function saveProductItemSubmit() {
    const index = parseInt(document.getElementById('item-edit-index').value);
    const name = document.getElementById('item-edit-name').value.trim();
    const price = parseFloat(document.getElementById('item-edit-price').value || 0);
    const cost_price = parseFloat(document.getElementById('item-edit-cost').value || 0);
    const uv_cost_price = parseFloat(document.getElementById('item-edit-uv-cost').value || 0);
    const image_url = document.getElementById('item-edit-image').value.trim();
    const designer_ratio = parseFloat(document.getElementById('item-edit-designer-ratio').value || 20);
    const packager_ratio = parseFloat(document.getElementById('item-edit-packager-ratio').value || 60);
    const platform_ratio = parseFloat(document.getElementById('item-edit-platform-ratio').value || 20);

    if (!name) {
      alert('請輸入項目名稱 (例如: 黑色-HELLO純棉款)');
      return;
    }

    const itemObj = {
      id: index >= 0 && currentProductItems[index] ? currentProductItems[index].id : ('v_' + Date.now() + '_' + Math.floor(Math.random()*1000)),
      name: name,
      price: price,
      cost_price: cost_price,
      uv_cost_price: uv_cost_price,
      image_url: image_url,
      designer_ratio: designer_ratio,
      packager_ratio: packager_ratio,
      platform_ratio: platform_ratio
    };

    if (index === -1) {
      currentProductItems.push(itemObj);
    } else {
      currentProductItems[index] = itemObj;
    }

    closeModal('modal-product-item');
    renderProductItemsList();
  }

  function removeProductItem(index) {
    currentProductItems.splice(index, 1);
    renderProductItemsList();
  }

  async function uploadMainProductImage(fileInput) {
    if (!fileInput.files || fileInput.files.length === 0) return;
    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/api/admin/upload-image', { method: 'POST', body: formData });
      const json = await res.json();
      if (json.status === 'success' && json.url) {
        document.getElementById('prod-edit-image').value = json.url;
        alert('商品主圖上傳成功！');
      } else {
        alert(json.message || '圖片上傳失敗');
      }
    } catch(e){ alert('圖片上傳發生錯誤'); }
  }

  async function uploadSubItemImage(fileInput) {
    if (!fileInput.files || fileInput.files.length === 0) return;
    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/api/admin/upload-image', { method: 'POST', body: formData });
      const json = await res.json();
      if (json.status === 'success' && json.url) {
        document.getElementById('item-edit-image').value = json.url;
        updateSubItemImagePreview();
        alert('項目規格圖片上傳成功！');
      } else {
        alert(json.message || '圖片上傳失敗');
      }
    } catch(e){ alert('圖片上傳發生錯誤'); }
  }

  function setVal(id, val) {
    const el = document.getElementById(id);
    if (el) el.value = (val !== undefined && val !== null) ? val : '';
  }

  function openProductModal(p = null) {
    setVal('prod-edit-id', p ? p.id : '');
    setVal('prod-edit-name', p ? p.name : '');
    setVal('prod-edit-category', p ? p.category : '3d-print');
    setVal('prod-edit-material', p ? p.material : 'TPU_95A');
    setVal('prod-edit-price', p ? p.price : '45.00');
    setVal('prod-edit-cost', p ? (p.cost_price || 15.00) : '15.00');
    setVal('prod-edit-uv-cost', p ? (p.uv_cost_price || 5.00) : '5.00');
    setVal('prod-edit-designer-ratio', p ? (p.designer_ratio !== undefined ? p.designer_ratio : 20) : 20);
    setVal('prod-edit-packager-ratio', p ? (p.packager_ratio !== undefined ? p.packager_ratio : 60) : 60);
    setVal('prod-edit-platform-ratio', p ? (p.platform_ratio !== undefined ? p.platform_ratio : 20) : 20);
    setVal('prod-edit-badge', p ? p.badge : '');

          return `<option value="${item.name}">${item.name} ($${itemPrice}) (庫存: ${itemStock})</option>`;

  async function handleLineBatchSendSubmit(e) {
    e.preventDefault();
    const checkedCbs = document.querySelectorAll('.send-group-checkbox:checked');
    const selectedGroupIds = Array.from(checkedCbs).map(cb => cb.value);
    const messageText = document.getElementById('batch-send-text').value.trim();

    if (selectedGroupIds.length === 0) {
      alert('請至少選擇一個發送群組 (可複選)！');
      return;
    }

    if (!messageText && selectedSendFiles.length === 0) {
      alert('請輸入文字訊息內容或選擇附件檔案！');
      return;
    }

    const btn = document.getElementById('btn-batch-send-submit');
    btn.disabled = true;
    btn.innerHTML = `<span class="animate-spin material-symbols-outlined">sync</span> 圖片上傳與 LINE 推播中，請稍候...`;

    try {
      const formData = new FormData();
      selectedGroupIds.forEach(gid => formData.append('group_ids', gid));
      formData.append('message', messageText);

      selectedSendFiles.forEach(file => {
        formData.append('files', file);
      });

      const res = await fetch('/api/admin/line/broadcast', {
        method: 'POST',
        body: formData
      });
      const json = await res.json();
      if (json.status === 'success') {
        alert(`🎉 ${json.message}`);
        document.getElementById('batch-send-text').value = '';
        selectedSendFiles = [];
        handleSelectedFilesChange([]);
      } else {
        alert(json.message || '發送失敗');

  function resolveProductRatios(item) {
    const pid = item && item.id;
    const variantName = (item && (item.variant_name || item.item_name)) || '';
    const prod = productsList.find(p => String(p.id) === String(pid));
    if (!prod) return { designer: 20, packager: 60, platform: 20 };
    let ratios = {
      designer: parseFloat(prod.designer_ratio !== undefined ? prod.designer_ratio : 20),
      packager: parseFloat(prod.packager_ratio !== undefined ? prod.packager_ratio : 60),
      platform: parseFloat(prod.platform_ratio !== undefined ? prod.platform_ratio : 20)
    };
    if (variantName && prod.items_json) {
      try {
        const arr = typeof prod.items_json === 'string' ? JSON.parse(prod.items_json) : (prod.items_json || []);
        const v = arr.find(x => (x.name || '') === variantName);
        if (v) {
          ratios = {
            designer: parseFloat(v.designer_ratio !== undefined ? v.designer_ratio : ratios.designer),
            packager: parseFloat(v.packager_ratio !== undefined ? v.packager_ratio : ratios.packager),
            platform: parseFloat(v.platform_ratio !== undefined ? v.platform_ratio : ratios.platform)
          };
        }
      } catch(e) {}
    }
    return ratios;
  }

        itemName: itm.name || itm.product_name || '-',
        variantName: (itm.variant_name || itm.item_name || ''),

  function recalcShipmentMaterialRow(idx, rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const name = tr.querySelector('.shipment-mat-name').value.trim();
    const capacity = parseFloat(tr.querySelector('.shipment-mat-capacity').value || 0);
    const unitCost = materialUnitCosts[name] || 0;
    const cost = capacity * unitCost;
    tr.querySelector('.shipment-mat-cost').value = cost.toFixed(2);
    calculateShipmentNetProfit();
  }

  function removeShipmentMaterialRow(idx, rowId) {
    const tr = document.getElementById(rowId);
    if (tr) tr.remove();
    calculateShipmentNetProfit();
  }

  function round2(v) { return Math.round((v + Number.EPSILON) * 100) / 100; }

  function calculateShipmentNetProfit() {
    if (!currentShipmentOrder) return;

    let totals = { sales: 0, material: 0, other: 0, shipping: 0, net: 0, designer: 0, packager: 0, platform: 0 };

    shipmentProducts.forEach((p, idx) => {
      let materialCost = 0;
      const tbody = document.getElementById('shipment-materials-tbody-' + idx);
      if (tbody) {
        tbody.querySelectorAll('.shipment-mat-cost').forEach(inp => {
          materialCost += parseFloat(inp.value || 0);
        });
      }
      const otherCost = parseFloat(document.getElementById('shipment-other-cost-' + idx).value || 0);
      const shippingCost = parseFloat(document.getElementById('shipment-shipping-cost-' + idx).value || 0);
      const netProfit = p.salesAmount - materialCost - otherCost - shippingCost;

      const designerAmount = netProfit * (p.designerRatio / 100);
      const packagerAmount = netProfit * (p.packagerRatio / 100);
      const platformAmount = netProfit * (p.platformRatio / 100);

      p.materialCost = round2(materialCost);
      p.otherCost = round2(otherCost);
      p.shippingCost = round2(shippingCost);
      p.netProfit = round2(netProfit);
      p.designerAmount = round2(designerAmount);
      p.packagerAmount = round2(packagerAmount);
      p.platformAmount = round2(platformAmount);

      document.getElementById('shipment-net-profit-' + idx).textContent = '$' + p.netProfit.toFixed(2);
      document.getElementById('shipment-designer-amount-' + idx).textContent = '$' + p.designerAmount.toFixed(2);
      document.getElementById('shipment-packager-amount-' + idx).textContent = '$' + p.packagerAmount.toFixed(2);
      document.getElementById('shipment-platform-amount-' + idx).textContent = '$' + p.platformAmount.toFixed(2);

      totals.sales += p.salesAmount;
      totals.material += p.materialCost;
      totals.other += p.otherCost;
      totals.shipping += p.shippingCost;
      totals.net += p.netProfit;
      totals.designer += p.designerAmount;
      totals.packager += p.packagerAmount;
      totals.platform += p.platformAmount;
    });

    document.getElementById('shipment-total-sales').textContent = '$' + totals.sales.toFixed(2);
    document.getElementById('shipment-total-material-cost').textContent = '$' + totals.material.toFixed(2);
    document.getElementById('shipment-total-other-cost').textContent = '$' + totals.other.toFixed(2);
    document.getElementById('shipment-total-shipping-cost').textContent = '$' + totals.shipping.toFixed(2);
    document.getElementById('shipment-total-net-profit').textContent = '$' + totals.net.toFixed(2);
    document.getElementById('shipment-total-designer').textContent = '$' + totals.designer.toFixed(2);
    document.getElementById('shipment-total-packager').textContent = '$' + totals.packager.toFixed(2);
    document.getElementById('shipment-total-platform').textContent = '$' + totals.platform.toFixed(2);
  }

  async function submitOrderShipmentConfirm() {
    if (!currentShipmentOrder) return;
    const orderId = currentShipmentOrder.id;

    const missingPerson = shipmentProducts.find(p => !p.designerId || !p.packagerId);
    if (missingPerson) {
      alert(`請為商品「${missingPerson.itemName}」選擇設計者與包裝人員`);
      return;
    }

    const productsPayload = shipmentProducts.map(p => {
      const materials = [];
      const tbody = document.getElementById('shipment-materials-tbody-' + p.idx);
      if (tbody) {
        tbody.querySelectorAll('tr').forEach(tr => {
          const name = tr.querySelector('.shipment-mat-name').value.trim();
          const capacity = parseFloat(tr.querySelector('.shipment-mat-capacity').value || 0);
          const cost = parseFloat(tr.querySelector('.shipment-mat-cost').value || 0);
          const unitCost = name ? (materialUnitCosts[name] || 0) : 0;
          if (name) {
            materials.push({ material_name: name, capacity_used: capacity, unit_cost: unitCost, cost: round2(cost) });
          }
        });
      }
      return {
        product_id: p.productId,
        item_name: p.variantName || p.itemName,
        sales_amount: round2(p.salesAmount),
        material_cost: p.materialCost || 0,
        other_cost: p.otherCost || 0,
        shipping_cost: p.shippingCost || 0,
        net_profit: p.netProfit || 0,
        designer_user_id: p.designerId,
        packager_user_id: p.packagerId,
        designer_ratio: p.designerRatio,
        packager_ratio: p.packagerRatio,
        platform_ratio: p.platformRatio,
        designer_amount: p.designerAmount || 0,
        packager_amount: p.packagerAmount || 0,
        platform_amount: p.platformAmount || 0,
        materials: materials
      };
    });

    const res = await fetch(`/api/admin/orders/${orderId}/ship`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ products: productsPayload })
    });

    const json = await res.json();
    if (json.status === 'success') {
      alert(`訂單 #${orderId} 已成功執行寄送！逐商品利潤結算與分潤已存檔。`);
      closeModal('modal-order-shipment');
      loadAdminOrdersList();
    } else {
      alert(json.message || '執行寄送失敗');
    }
  }

  async function cancelAdminOrder(orderId) {
    if (!confirm(`確定取消訂單 #${orderId}？取消後會釋放庫存。`)) return;
    const res = await fetch(`/api/admin/orders/${orderId}/cancel`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: '{}'
    });
    const json = await res.json();
    alert(json.message || (json.status === 'success' ? '訂單已取消' : '取消失敗'));
    loadAdminOrdersList();
  }

  // --- Bonus 獎金統計 ---
  let bonusSummaryData = { platform_total: 0, members: [], entries: [] };

  function defaultBonusRange() {
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const pad = n => String(n).padStart(2, '0');
    const fromEl = document.getElementById('bonus-from');
    const toEl = document.getElementById('bonus-to');
    if (fromEl) fromEl.value = `${first.getFullYear()}-${pad(first.getMonth() + 1)}-${pad(first.getDate())}`;
    if (toEl) toEl.value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }

  async function loadBonusSummary() {
    const from = document.getElementById('bonus-from').value;
    const to = document.getElementById('bonus-to').value;
    if (!from || !to) return alert('請選擇開始與結束日期');
    try {
      const res = await fetch(`/api/admin/bonuses?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
      const json = await res.json();
      if (json.status === 'success') {
        bonusSummaryData = json;
        renderBonusSummary();
      }
    } catch(e) { console.error(e); }
  }

  function renderBonusSummary() {
    const d = bonusSummaryData;
    document.getElementById('bonus-platform-total').textContent = '$' + parseFloat(d.platform_total || 0).toFixed(2);
    const membersTotal = (d.members || []).reduce((a, m) => a + parseFloat(m.total || 0), 0);
    document.getElementById('bonus-members-total').textContent = '$' + membersTotal.toFixed(2);
    document.getElementById('bonus-entries-count').textContent = (d.entries || []).length;

    const tbody = document.getElementById('bonus-members-tbody');
    if (!tbody) return;
    if (!d.members || d.members.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400 italic">此期間沒有結算獎金</td></tr>`;
      return;
    }
    tbody.innerHTML = d.members.map(m => `
      <tr class="hover:bg-surface-container/50">
        <td class="p-3 font-bold text-white">${m.name}</td>
        <td class="p-3 text-right text-primary-fixed font-bold">$${parseFloat(m.designer_amount || 0).toFixed(2)}</td>
        <td class="p-3 text-right text-secondary-container font-bold">$${parseFloat(m.packager_amount || 0).toFixed(2)}</td>
        <td class="p-3 text-right text-line-green font-black">$${parseFloat(m.total || 0).toFixed(2)}</td>
        <td class="p-3 text-right">
          <button onclick="openBonusDetail('${m.user_id}')" class="text-primary-fixed hover:underline font-bold">查看明細</button>
        </td>
      </tr>
    `).join('');
  }

  function openBonusDetail(userId) {
    const entries = (bonusSummaryData.entries || []).filter(e => e.user_id === userId);
    const member = (bonusSummaryData.members || []).find(m => m.user_id === userId);
    document.getElementById('bonus-detail-summary').textContent =
      `${member ? member.name : userId} 的獎金明細（共 ${entries.length} 筆）`;
    const list = document.getElementById('bonus-detail-list');
    if (entries.length === 0) {
      list.innerHTML = `<div class="text-xs text-gray-400 italic">無明細</div>`;
    } else {
      list.innerHTML = entries.map(e => `
        <div class="flex justify-between items-center p-3 bg-surface-container rounded border border-outline-variant">
          <div>
            <div class="font-bold text-white text-xs">${e.order_id} · ${e.item_name || '-'}</div>
            <div class="text-[10px] text-gray-400 mt-0.5">${e.settled_at || ''} · 角色: ${e.role === 'designer' ? '設計者' : '包裝人員'} · 比率 ${parseFloat(e.ratio || 0)}%</div>
          </div>
          <div class="text-line-green font-black text-sm">$${parseFloat(e.amount || 0).toFixed(2)}</div>
        </div>
      `).join('');
    }
    document.getElementById('modal-bonus-detail').classList.remove('hidden');
  }

  function editAdminOrder(orderId) {
    alert(`[修改訂單機能]\n已載入訂單 #${orderId} 狀態，可手動更新相關資訊。`);
  }
</script>
