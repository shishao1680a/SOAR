<!-- Application Logic JavaScript -->
<script>
  const dataLoaded = { users: false, products: false, materials: false, lineGroups: false, bulletins: false, orders: false, bonuses: false };

  document.addEventListener("DOMContentLoaded", () => {
    // 儀表板不需預載資料；進入各分頁時才 lazy load，減少進入後台的請求數
  });

  // 頁籤 Tab 切換選單
  function switchProductSubTab(subTabId) {
    ['products', 'inventory', 'materials', 'material-manage'].forEach(tab => {
      const contentEl = document.getElementById(`prod-subtab-${tab}`);
      const btnEl = document.getElementById(`prod-tab-${tab}`);
      if (contentEl) contentEl.classList.add('hidden');
      if (btnEl) {
        btnEl.className = "px-5 py-3 font-bold italic border-b-4 border-transparent text-gray-400 hover:text-white hover:bg-surface-container transition-all flex items-center gap-2";
      }
    });

    const activeContent = document.getElementById(`prod-subtab-${subTabId}`);
    const activeBtn = document.getElementById(`prod-tab-${subTabId}`);
    if (activeContent) activeContent.classList.remove('hidden');
    if (activeBtn) {
      if (subTabId === 'products') {
        activeBtn.className = "px-5 py-3 font-bold italic border-b-4 border-primary-fixed text-primary-fixed bg-surface-container-high transition-all flex items-center gap-2";
      } else if (subTabId === 'inventory') {
        activeBtn.className = "px-5 py-3 font-bold italic border-b-4 border-secondary-container text-secondary-container bg-surface-container-high transition-all flex items-center gap-2";
      } else if (subTabId === 'materials') {
        activeBtn.className = "px-5 py-3 font-bold italic border-b-4 border-cyan-400 text-cyan-400 bg-surface-container-high transition-all flex items-center gap-2";
      } else if (subTabId === 'material-manage') {
        activeBtn.className = "px-5 py-3 font-bold italic border-b-4 border-cyan-400 text-cyan-400 bg-surface-container-high transition-all flex items-center gap-2";
      }
    }

    if (subTabId === 'material-manage') {
      defaultMaterialMgmtRange();
      loadMaterialManagementSummary();
      loadMaterialNamesForDatalist();
      loadMaterialMeasureTypes();
    }
  }

  function switchAdminSection(secId) {
    ['dashboard', 'users', 'products', 'orders', 'bonuses', 'line-groups', 'line-send', 'bulletins'].forEach(s => {
      const sec = document.getElementById(`sec-${s}`);
      if (sec) sec.classList.add('hidden');
      const sideBtn = document.getElementById(`side-${s}`);
      if (sideBtn) {
        sideBtn.className = "w-full text-left p-3 rounded font-bold italic flex items-center gap-2 text-on-surface-variant hover:bg-surface-container hover:text-white transition-colors";
      }
    });

    const activeSec = document.getElementById(`sec-${secId}`);
    if (activeSec) activeSec.classList.remove('hidden');
    const activeBtn = document.getElementById(`side-${secId}`);
    if (activeBtn) {
      activeBtn.className = "w-full text-left p-3 rounded font-bold italic flex items-center gap-2 bg-primary-fixed text-on-primary-fixed";
    }

    if (secId === 'users' && !dataLoaded.users) {
      dataLoaded.users = true;
      loadUsers();
    } else if (secId === 'products') {
      if (!dataLoaded.products) {
        dataLoaded.products = true;
        loadProducts();
      }
      loadMaterialUnitCosts();
      if (!dataLoaded.materials) {
        dataLoaded.materials = true;
        loadMaterialPurchases();
      }
    } else if (secId === 'orders' && !dataLoaded.orders) {
      dataLoaded.orders = true;
      loadAdminOrdersList();
    } else if (secId === 'bonuses') {
      // 每次點進獎金頁都重新查詢，避免編輯後看到舊資料
      defaultBonusRange();
      loadBonusSummary();
      if (!dataLoaded.users) {
        dataLoaded.users = true;
        loadUsers().then(populateBonusMemberFilter);
      } else {
        populateBonusMemberFilter();
      }
    } else if ((secId === 'line-groups' || secId === 'line-send') && !dataLoaded.lineGroups) {
      dataLoaded.lineGroups = true;
      loadLineGroups();
    } else if (secId === 'bulletins' && !dataLoaded.bulletins) {
      dataLoaded.bulletins = true;
      loadBulletins();
    }
  }

  function closeModal(modalId) {
    document.getElementById(modalId).classList.add('hidden');
  }

  // --- Member Management Logic ---
  let usersList = [];
  async function loadUsers() {
    try {
      const res = await fetch('/api/admin/users');
      const json = await res.json();
      if (json.status === 'success') {
        usersList = json.data;
        renderUsersTable();
      }
    } catch(e) { console.error(e); }
  }

  function renderUsersTable() {
    const tbody = document.getElementById('user-table-body');
    const roleMap = {
      admin: { label: '👑 最高管理員', style: 'bg-primary-fixed text-on-primary-fixed' },
      assistant_coach: { label: '🧢 助理教練', style: 'bg-secondary-container text-white' },
      user: { label: '🏃 一般使用者', style: 'bg-surface-container text-on-surface-variant' }
    };

    tbody.innerHTML = usersList.map(u => {
      const r = roleMap[u.role] || roleMap.user;
      return `
        <tr class="hover:bg-surface-container/50">
          <td class="p-3 flex items-center gap-2">
            <img src="${u.avatar_url}" class="w-7 h-7 rounded-full border border-primary-fixed" />
            <span class="font-bold text-white">${u.name}</span>
          </td>
          <td class="p-3 text-primary-fixed font-bold">${u.username || '-'}</td>
          <td class="p-3 text-line-green">${u.line_id || '-'}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 ${r.style} rounded font-bold">
              ${r.label}
            </span>
          </td>
          <td class="p-3">${u.phone || '-'}</td>
          <td class="p-3 text-on-surface-variant text-[11px]">${u.register_date || '-'}</td>
          <td class="p-3 text-right">
            <button onclick="editUser('${u.id}')" class="text-primary-fixed hover:underline mr-2">編輯</button>
            <button onclick="deleteUser('${u.id}')" class="text-error hover:underline">刪除</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function openUserModal(u = null) {
    document.getElementById('user-edit-id').value = u ? u.id : '';
    document.getElementById('user-edit-name').value = u ? u.name : '';
    document.getElementById('user-edit-username').value = u ? (u.username || '') : '';
    document.getElementById('user-edit-password').value = '';
    document.getElementById('user-edit-lineid').value = u ? (u.line_id || '') : '';
    document.getElementById('user-edit-role').value = u ? u.role : 'member';
    document.getElementById('modal-user').classList.remove('hidden');
  }

  function editUser(id) {
    const u = usersList.find(item => item.id === id);
    if (u) openUserModal(u);
  }

  async function saveUserSubmit() {
    const payload = {
      id: document.getElementById('user-edit-id').value,
      name: document.getElementById('user-edit-name').value.trim(),
      username: document.getElementById('user-edit-username').value.trim(),
      password: document.getElementById('user-edit-password').value.trim(),
      line_id: document.getElementById('user-edit-lineid').value.trim(),
      role: document.getElementById('user-edit-role').value
    };

    const res = await fetch('/api/admin/users', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.status === 'success') {
      alert('成員資料更新成功！');
      closeModal('modal-user');
      loadUsers();
    } else { alert(json.message); }
  }

  async function deleteUser(id) {
    if (!confirm('確定要刪除此成員嗎？')) return;
    const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
    const json = await res.json();
    if (json.status === 'success') { loadUsers(); }
  }

  // --- Product & Inventory Logic ---
  let productsList = [];
  let currentProductItems = [];

  async function loadProducts() {
    try {
      await loadProductOptions();
      const res = await fetch('/api/products');
      const json = await res.json();
      if (json.status === 'success') {
        productsList = json.data;
        await loadInventoryLogs();
        renderProductsTable();
        updateInventorySelect();
      }
    } catch(e) { console.error(e); }
  }

  async function loadProductOptions() {
    try {
      const res = await fetch('/api/product-options');
      const json = await res.json();
      if (json.status === 'success') {
        const catSelect = document.getElementById('prod-edit-category');
        const matSelect = document.getElementById('prod-edit-material');
        
        const defaultCats = [
          { code: '3d-print', name: '3D列印套件 (3d-print)' },
          { code: 'uv-print', name: 'UV炫彩作品 (uv-print)' },
          { code: 'custom', name: '社團限定 (custom)' }
        ];
        const defaultMats = [
          { code: 'TPU_95A', name: 'TPU_95A' },
          { code: 'PLA_PRO', name: 'PLA_PRO' },
          { code: 'NYLON_CF', name: 'NYLON_CF' },
          { code: 'UV_RESIN', name: 'UV_RESIN' }
        ];

        const allCats = [...defaultCats];
        (json.categories || []).forEach(c => {
          if (!allCats.some(x => x.code === c.code)) allCats.push(c);
        });
        const allMats = [...defaultMats];
        (json.materials || []).forEach(m => {
          if (!allMats.some(x => x.code === m.code)) allMats.push(m);
        });

        catSelect.innerHTML = allCats.map(c => `<option value="${c.code}">${c.name}</option>`).join('');
        matSelect.innerHTML = allMats.map(m => `<option value="${m.code}">${m.name}</option>`).join('');
      }
    } catch(e){}
  }

  async function promptAddCategory() {
    const name = prompt('請輸入新分類名稱 (例如：車架升級套件、競賽級護具):');
    if (!name || !name.trim()) return;
    const res = await fetch('/api/admin/product-options/category', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name.trim() })
    });
    const json = await res.json();
    if (json.status === 'success') {
      alert('分類新增成功！');
      await loadProductOptions();
      document.getElementById('prod-edit-category').value = json.code;
    } else { alert(json.message); }
  }

  async function promptAddMaterial() {
    const name = prompt('請輸入新材質等級/小分類名稱 (例如：TPU_95A_PRO、CARBON_FIBER):');
    if (!name || !name.trim()) return;
    const res = await fetch('/api/admin/product-options/material', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name.trim() })
    });
    const json = await res.json();
    if (json.status === 'success') {
      alert('材質等級/小分類新增成功！');
      await loadProductOptions();
      document.getElementById('prod-edit-material').value = json.code;
    } else { alert(json.message); }
  }

  let inventoryLogsList = [];

  function renderProductsTable() {
    const tbody = document.getElementById('product-table-body');
    tbody.innerHTML = productsList.map(p => {
      let multiImgs = [];
      let itemsArr = [];
      try { multiImgs = JSON.parse(p.images_json || '[]'); } catch(e){}
      try {
        itemsArr = typeof p.items_json === 'string' ? JSON.parse(p.items_json || '[]') : (p.items_json || []);
      } catch(e){ itemsArr = []; }

      const hasItems = itemsArr && itemsArr.length > 0;

      const itemsNameHtml = hasItems
        ? itemsArr.map(item => `
            <div class="flex items-center gap-1.5 bg-surface-container-high/90 px-2.5 py-1 rounded border border-outline-variant/60 whitespace-nowrap mb-1">
              ${item.image_url ? `<img src="${item.image_url}" class="w-4 h-4 object-cover rounded border border-outline-variant shrink-0" />` : '<span class="material-symbols-outlined text-[12px] text-line-green shrink-0">tune</span>'}
              <span class="font-bold text-white text-[11px]">${item.name}</span>
            </div>
          `).join('')
        : `<span class="text-gray-400 italic text-[11px]">- (無項目)</span>`;

      const itemsPriceHtml = hasItems
        ? itemsArr.map(item => `
            <div class="py-1 text-primary-fixed font-bold font-mono text-[11px] mb-1">
              $${parseFloat(item.price !== undefined ? item.price : p.price).toFixed(2)}
            </div>
          `).join('')
        : `<span class="text-primary-fixed font-bold font-mono">$${parseFloat(p.price).toFixed(2)}</span>`;

      const itemsStockHtml = hasItems
        ? itemsArr.map(item => {
            const qty = parseInt(item.stock_qty !== undefined ? item.stock_qty : 0) || 0;
            return `
              <div class="py-1 font-bold font-mono text-[11px] mb-1 ${qty < 10 ? 'text-error' : 'text-line-green'}">
                ${qty} 件
              </div>
            `;
          }).join('')
        : `<span class="font-bold ${parseInt(p.stock_qty || 0) < 10 ? 'text-error' : 'text-line-green'}">${parseInt(p.stock_qty || 0)} 件</span>`;

      return `
        <tr class="hover:bg-surface-container/50">
          <td class="p-3">
            <div class="flex items-center gap-1">
              <img src="${p.image_url}" class="w-10 h-10 object-cover border border-outline-variant rounded" />
              ${multiImgs.length > 1 ? `<span class="text-[10px] bg-secondary-container text-white px-1 font-bold rounded">+${multiImgs.length - 1}圖</span>` : ''}
            </div>
          </td>
          <td class="p-3 font-bold text-white whitespace-nowrap">
            ${p.name}
            ${hasItems ? `<span class="block text-[10px] text-gray-400 font-normal">(${itemsArr.length} 個項目)</span>` : ''}
          </td>
          <td class="p-3"><span class="text-primary-fixed">${p.category}</span> / ${p.material}</td>
          <td class="p-3">
            <div class="max-w-[200px] space-y-1">
              ${itemsNameHtml}
            </div>
          </td>
          <td class="p-3">${itemsPriceHtml}</td>
          <td class="p-3">${itemsStockHtml}</td>
          <td class="p-3 text-right whitespace-nowrap">
            <button onclick="editProduct('${p.id}')" class="text-primary-fixed hover:underline mr-2 font-bold">編輯</button>
            <button onclick="deleteProduct('${p.id}')" class="text-error hover:underline font-bold">下架</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function updateSubItemImagePreview() {
    const url = document.getElementById('item-edit-image').value.trim();
    const previewBox = document.getElementById('item-edit-preview-box');
    const previewImg = document.getElementById('item-edit-img-preview');
    if (url) {
      previewImg.src = url;
      previewBox.classList.remove('hidden');
    } else {
      previewBox.classList.add('hidden');
    }
  }

  function renderProductItemsList() {
    const container = document.getElementById('product-items-list-container');
    if (!container) return;

    if (currentProductItems.length === 0) {
      container.innerHTML = `
        <div class="text-center p-4 text-xs text-gray-400 italic bg-surface-container/40 rounded-lg border border-dashed border-outline-variant/60">
          目前尚無項目規格。點擊右上角【+ 新增項目】跳出視窗即可新增不同款式 (例: 黑色-HELLO純棉款)。
        </div>
      `;
      return;
    }

    container.innerHTML = currentProductItems.map((item, index) => `
      <div class="flex items-center justify-between p-3 bg-surface-container border border-outline-variant rounded-lg hover:border-line-green/60 transition-all gap-2">
        <div class="flex items-center gap-3 overflow-hidden">
          <img src="${item.image_url || 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=150&q=80'}" class="w-10 h-10 object-cover rounded border border-outline-variant shrink-0" />
          <div class="truncate">
            <div class="font-bold text-white text-xs truncate flex items-center gap-1">
              <span class="text-line-green font-mono text-[11px]">#${index + 1}</span> ${item.name || '未命名項目'}
            </div>
            <div class="text-[11px] text-gray-300 font-mono mt-0.5">
              售價: <span class="text-primary-fixed font-bold">$${parseFloat(item.price !== undefined ? item.price : 0).toFixed(2)}</span>
            </div>
          </div>
        </div>
        <div class="flex gap-1.5 shrink-0">
          <button type="button" onclick="openProductItemModal(${index})" class="px-2.5 py-1 bg-primary-fixed/20 text-primary-fixed hover:bg-primary-fixed hover:text-black font-bold text-xs rounded transition-all border border-primary-fixed/30 flex items-center gap-1">
            <span class="material-symbols-outlined text-xs">edit</span> 編輯
          </button>
          <button type="button" onclick="removeProductItem(${index})" class="px-2 py-1 bg-error/20 text-error hover:bg-error hover:text-white font-bold text-xs rounded transition-all flex items-center gap-0.5">
            ✕ 刪除
          </button>
        </div>
      </div>
    `).join('');
  }

  function addProductItem() {
    openProductItemModal(-1);
  }

  function openProductItemModal(index = -1) {
    const titleEl = document.getElementById('item-modal-title');
    document.getElementById('item-edit-index').value = index;

    if (index === -1) {
      if (titleEl) titleEl.innerHTML = `<span class="material-symbols-outlined text-line-green text-lg">add_circle</span> 新增項目規格`;
      setVal('item-edit-name', `款式 #${currentProductItems.length + 1}`);
      setVal('item-edit-price', document.getElementById('prod-edit-price').value || '45.00');
      setVal('item-edit-cost', document.getElementById('prod-edit-cost').value || '18.00');
      setVal('item-edit-uv-cost', document.getElementById('prod-edit-uv-cost').value || '5.00');
      setVal('item-edit-image', document.getElementById('prod-edit-image').value || '');
      setVal('item-edit-designer-ratio', document.getElementById('prod-edit-designer-ratio').value || 20);
      setVal('item-edit-packager-ratio', document.getElementById('prod-edit-packager-ratio').value || 60);
      setVal('item-edit-platform-ratio', document.getElementById('prod-edit-platform-ratio').value || 20);
    } else {
      const item = currentProductItems[index];
      if (titleEl) titleEl.innerHTML = `<span class="material-symbols-outlined text-line-green text-lg">edit_note</span> 編輯項目規格 #${index + 1}`;
      setVal('item-edit-name', item ? item.name : '');
      setVal('item-edit-price', item ? item.price : 0);
      setVal('item-edit-cost', item ? item.cost_price : 0);
      setVal('item-edit-uv-cost', item ? item.uv_cost_price : 0);
      setVal('item-edit-image', item ? item.image_url : '');
      setVal('item-edit-designer-ratio', item ? (item.designer_ratio !== undefined ? item.designer_ratio : 20) : 20);
      setVal('item-edit-packager-ratio', item ? (item.packager_ratio !== undefined ? item.packager_ratio : 60) : 60);
      setVal('item-edit-platform-ratio', item ? (item.platform_ratio !== undefined ? item.platform_ratio : 20) : 20);
    }

    updateSubItemImagePreview();

    const subModal = document.getElementById('modal-product-item');
    if (subModal) subModal.classList.remove('hidden');
  }

  function saveProductItemSubmit() {
    const index = parseInt(document.getElementById('item-edit-index').value);
    const name = document.getElementById('item-edit-name').value.trim();
    const price = parseFloat(document.getElementById('item-edit-price').value || 0);
    const cost_price = parseFloat(document.getElementById('item-edit-cost').value || 0);
    const uv_cost_price = parseFloat(document.getElementById('item-edit-uv-cost').value || 0);
    const image_url = document.getElementById('item-edit-image').value.trim();
    const designer_ratio = parseFloat(document.getElementById('item-edit-designer-ratio').value || 20);
    const packager_ratio = parseFloat(document.getElementById('item-edit-packager-ratio').value || 60);
    const platform_ratio = parseFloat(document.getElementById('item-edit-platform-ratio').value || 20);

    if (!name) {
      alert('請輸入項目名稱 (例如: 黑色-HELLO純棉款)');
      return;
    }

    const itemObj = {
      id: index >= 0 && currentProductItems[index] ? currentProductItems[index].id : ('v_' + Date.now() + '_' + Math.floor(Math.random()*1000)),
      name: name,
      price: price,
      cost_price: cost_price,
      uv_cost_price: uv_cost_price,
      image_url: image_url,
      designer_ratio: designer_ratio,
      packager_ratio: packager_ratio,
      platform_ratio: platform_ratio
    };

    if (index === -1) {
      currentProductItems.push(itemObj);
    } else {
      currentProductItems[index] = itemObj;
    }

    closeModal('modal-product-item');
    renderProductItemsList();
  }

  function removeProductItem(index) {
    currentProductItems.splice(index, 1);
    renderProductItemsList();
  }

  async function uploadMainProductImage(fileInput) {
    if (!fileInput.files || fileInput.files.length === 0) return;
    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/api/admin/upload-image', { method: 'POST', body: formData });
      const json = await res.json();
      if (json.status === 'success' && json.url) {
        document.getElementById('prod-edit-image').value = json.url;
        alert('商品主圖上傳成功！');
      } else {
        alert(json.message || '圖片上傳失敗');
      }
    } catch(e){ alert('圖片上傳發生錯誤'); }
  }

  async function uploadSubItemImage(fileInput) {
    if (!fileInput.files || fileInput.files.length === 0) return;
    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/api/admin/upload-image', { method: 'POST', body: formData });
      const json = await res.json();
      if (json.status === 'success' && json.url) {
        document.getElementById('item-edit-image').value = json.url;
        updateSubItemImagePreview();
        alert('項目規格圖片上傳成功！');
      } else {
        alert(json.message || '圖片上傳失敗');
      }
    } catch(e){ alert('圖片上傳發生錯誤'); }
  }

  async function uploadMaterialImage(fileInput, inputId, previewId) {
    if (!fileInput.files || fileInput.files.length === 0) return;
    uploadMaterialImageFile(fileInput.files[0], inputId, previewId);
  }

  async function uploadMaterialImageFile(file, inputId, previewId) {
    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/api/admin/upload-image', { method: 'POST', body: formData });
      const json = await res.json();
      if (json.status === 'success' && json.url) {
        document.getElementById(inputId).value = json.url;
        const preview = document.getElementById(previewId);
        if (preview) {
          preview.src = json.url;
          preview.classList.remove('hidden');
        }
        alert('耗材圖片上傳成功！');
      } else {
        alert(json.message || '圖片上傳失敗');
      }
    } catch(e){ alert('圖片上傳發生錯誤'); }
  }

  function handleMaterialPaste(e, inputId, previewId) {
    if (!e.clipboardData) return;
    const isPasteZone = e.target && e.target.classList && e.target.classList.contains('material-paste-zone');
    const items = e.clipboardData.items || [];
    for (const item of items) {
      if (item.type && item.type.indexOf('image/') === 0) {
        const file = item.getAsFile && item.getAsFile();
        if (file) {
          e.preventDefault();
          uploadMaterialImageFile(file, inputId, previewId);
          return;
        }
      }
    }

    // 剪貼簿沒有圖片本體時，嘗試取出圖片網址（複製「圖片連結」的情況）
    let url = null;
    const html = e.clipboardData.getData('text/html') || '';
    const imgMatch = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (imgMatch) url = imgMatch[1];
    if (!url) {
      const uriList = e.clipboardData.getData('text/uri-list') || '';
      const m = uriList.match(/https?:\/\/[^\s]+/i);
      if (m) url = m[0];
    }
    if (!url) {
      const plain = e.clipboardData.getData('text/plain') || '';
      const m = plain.match(/https?:\/\/[^\s]+/i);
      if (m) url = m[0];
    }

    if (url && /^https?:\/\//i.test(url)) {
      // 只有「貼上圖片」區域才把網址當圖片；一般文字欄位貼網址不攔截
      if (isPasteZone) {
        e.preventDefault();
        document.getElementById(inputId).value = url;
        const preview = document.getElementById(previewId);
        if (preview) {
          preview.src = url;
          preview.classList.remove('hidden');
        }
        alert('已貼上圖片網址（外部連結，若來源網站移除圖片可能無法顯示）');
      }
      return;
    }

    if (isPasteZone) {
      alert('沒有偵測到圖片，請先複製圖片後再貼上（或使用「上傳圖片」按鈕）');
    }
  }

  async function saveConsumptionLogSubmit() {
    const material_name = document.getElementById('mcons-name').value.trim();
    const amount = parseFloat(document.getElementById('mcons-amount').value || 0);
    if (!material_name) return alert('請輸入或選擇耗材名稱');
    if (!amount || amount <= 0) return alert('請填寫消耗量（需大於 0）');
    const rawDate = document.getElementById('mcons-date').value;
    const consumed_at = rawDate ? rawDate.replace('T', ' ') + ':00' : '';
    const unitCost = materialUnitCosts[material_name] || 0;
    const logId = document.getElementById('mcons-id').value;
    const method = logId ? 'PUT' : 'POST';
    const url = logId ? `/api/admin/material-consumptions/${logId}` : '/api/admin/material-consumptions';
    const payload = {
      material_name: material_name,
      amount: amount,
      measure_type: document.getElementById('mcons-measure-type').value,
      cost: round2(amount * unitCost),
      unit_cost: unitCost,
      remark: document.getElementById('mcons-remark').value.trim(),
      consumed_at: consumed_at
    };
    try {
      const res = await fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.status === 'success') {
        alert(json.message || (logId ? '消耗記錄已更新！' : '消耗記錄已儲存！'));

  async function handleLineBatchSendSubmit(e) {
    e.preventDefault();
    const checkedCbs = document.querySelectorAll('.send-group-checkbox:checked');
    const selectedGroupIds = Array.from(checkedCbs).map(cb => cb.value);
    const messageText = document.getElementById('batch-send-text').value.trim();

    if (selectedGroupIds.length === 0) {
      alert('請至少選擇一個發送群組 (可複選)！');
      return;
    }

    if (!messageText && selectedSendFiles.length === 0) {
      alert('請輸入文字訊息內容或選擇附件檔案！');
      return;
    }

    const btn = document.getElementById('btn-batch-send-submit');
    btn.disabled = true;
    btn.innerHTML = `<span class="animate-spin material-symbols-outlined">sync</span> 圖片上傳與 LINE 推播中，請稍候...`;

    try {
      const formData = new FormData();
      selectedGroupIds.forEach(gid => formData.append('group_ids', gid));
      formData.append('message', messageText);

      selectedSendFiles.forEach(file => {
        formData.append('files', file);
      });

      const res = await fetch('/api/admin/line/broadcast', {
        method: 'POST',
        body: formData
      });
      const json = await res.json();
      if (json.status === 'success') {
        alert(`🎉 ${json.message}`);
        document.getElementById('batch-send-text').value = '';
        selectedSendFiles = [];
        handleSelectedFilesChange([]);
      } else {
        alert(json.message || '發送失敗');
      }
    } catch (err) {
      console.error(err);
      alert('發送過程中發生連線錯誤');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<span class="material-symbols-outlined">send</span> 確認發送群組訊息`;
    }
  }

  function renderAdminOrdersTable() {
    const tbody = document.getElementById('orders-table-body');
    if (!tbody) return;
    if (adminOrdersList.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9" class="p-6 text-center text-gray-400 italic">尚無訂單資料。當使用者在前端購物車結帳時，訂單將自動即時顯示於此。</td>
        </tr>
      `;
      return;
    }

    let filtered = adminOrdersList;
    if (ordersStatusFilter === 'pending') {
      filtered = adminOrdersList.filter(o => !['SHIPPED', 'COMPLETED', 'CANCELLED'].includes(o.status));
    } else if (ordersStatusFilter === 'shipped') {
      filtered = adminOrdersList.filter(o => o.status === 'SHIPPED' || o.status === 'COMPLETED');
    } else if (ordersStatusFilter === 'cancelled') {
      filtered = adminOrdersList.filter(o => o.status === 'CANCELLED');
    }

    if (filtered.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9" class="p-6 text-center text-gray-400 italic">此狀態目前沒有訂單。</td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = filtered.map(o => {
      let itemsSummary = '';
      let unitPriceLines = '';
      try {
        const items = typeof o.items_json === 'string' ? JSON.parse(o.items_json || '[]') : (o.items_json || []);
        const lines = items.map(i => {
          const qty = parseInt(i.qty || 1, 10) || 1;
          const name = i.name || i.product_name || '線上列印作品';
          let price = parseFloat(i.price);
          if (isNaN(price)) price = parseFloat(o.total_amount || 0) / qty;
          price = isNaN(price) ? null : round2(price);
          return { name, qty, price };
        });
        itemsSummary = lines.map(l => l.name).join('<br/>');
        unitPriceLines = lines.map(l => (l.price === null ? '-' : '$' + l.price.toFixed(2))).join('<br/>');
      } catch(e) {
        itemsSummary = o.items_json || '-';
        unitPriceLines = '-';
      }

      const totalQty = (function(){
        try {
          const items = typeof o.items_json === 'string' ? JSON.parse(o.items_json || '[]') : (o.items_json || []);
          return items.reduce((acc, i) => acc + (i.qty || 1), 0);
        } catch(e) { return 1; }
      })();

      const isShipped = o.status === 'SHIPPED' || o.status === 'COMPLETED';
      const isCancelled = o.status === 'CANCELLED';

      return `
        <tr class="hover:bg-surface-container/50">
          <td class="p-3 text-on-surface-variant whitespace-nowrap">${o.created_at || '-'}</td>
          <td class="p-3 font-mono text-xs text-cyan-300 font-bold">${o.id}</td>
          <td class="p-3 text-white font-bold">${itemsSummary || '線上列印作品'}</td>
          <td class="p-3 text-primary-fixed font-bold">${totalQty} 件</td>
          <td class="p-3 text-primary-fixed font-bold">${unitPriceLines || '-'}</td>
          <td class="p-3 text-gray-200 font-bold">${o.user_name || '線上會員'} (${o.user_line_id || '-'})</td>
          <td class="p-3 text-primary-fixed font-black">$${parseFloat(o.total_amount || 0).toFixed(2)}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 text-[11px] rounded font-bold ${isCancelled ? 'bg-error/20 text-error border border-error' : isShipped ? 'bg-line-green/20 text-line-green border border-line-green' : 'bg-secondary-container/20 text-secondary-container border border-secondary-container'}">
              ${isCancelled ? '已取消' : isShipped ? '已寄送' : '待處理解算'}
            </span>
          </td>
          <td class="p-3 text-right whitespace-nowrap">
            ${isCancelled || isShipped ? '' : `<button onclick="openOrderShipmentModal('${o.id}')" class="px-2.5 py-1 bg-line-green hover:bg-line-green/80 text-white font-bold rounded text-xs mr-1 shadow">
              寄送
            </button>`}
            <button onclick="editAdminOrder('${o.id}')" class="px-2.5 py-1 bg-surface-container border border-outline-variant text-gray-200 hover:text-white font-bold rounded text-xs">
              修改
            </button>
            ${isShipped || isCancelled ? '' : `<button onclick="cancelAdminOrder('${o.id}')" class="px-2.5 py-1 bg-error/20 hover:bg-error text-error hover:text-white font-bold rounded text-xs mr-1 shadow">
              取消
            </button>`}
          </td>
        </tr>
      `;
    }).join('');
  }

  // --- 耗材單位成本與可分配人員 ---
  let materialUnitCosts = {};
  let materialImages = {};
  let materialNameList = [];
  let materialMeasureTypes = {};
  let materialMetaLoaded = { unitCosts: false, images: false, names: false, measureTypes: false };

  async function loadMaterialUnitCosts(force) {
    if (!force && materialMetaLoaded.unitCosts) return;
    try {
      const res = await fetch('/api/admin/material-unit-costs');
      const json = await res.json();
      materialUnitCosts = (json.status === 'success') ? (json.data || {}) : {};
      materialMetaLoaded.unitCosts = true;
    } catch(e) { materialUnitCosts = {}; }
  }

  async function loadMaterialImages(force) {
    if (!force && materialMetaLoaded.images) return;
    try {
      const res = await fetch('/api/admin/material-images');
      const json = await res.json();
      materialImages = (json.status === 'success') ? (json.data || {}) : {};
      materialMetaLoaded.images = true;
    } catch(e) { materialImages = {}; }
  }

  async function loadMaterialMeasureTypes(force) {
    if (!force && materialMetaLoaded.measureTypes) return;
    try {
      const res = await fetch('/api/admin/material-measure-types');
      const json = await res.json();
      materialMeasureTypes = (json.status === 'success') ? (json.data || {}) : {};
      materialMetaLoaded.measureTypes = true;
    } catch(e) { materialMeasureTypes = {}; }
  }

  function getEligibleUsers() {
    return (usersList || []).filter(u => u.role === 'admin' || u.role === 'assistant_coach');
  }

  async function ensureUsersLoaded() {
    if (!dataLoaded.users) {
      dataLoaded.users = true;
      await loadUsers();
    }
  }

  async function ensureProductsLoaded() {
    if (!dataLoaded.products) {
      dataLoaded.products = true;
      await loadProducts();
    }
  }

  function resolveProductRatios(item) {
    const pid = item && item.id;
    const variantName = (item && (item.variant_name || item.item_name)) || '';
    const prod = productsList.find(p => String(p.id) === String(pid));
    if (!prod) return { designer: 20, packager: 60, platform: 20 };
    let ratios = {
      designer: parseFloat(prod.designer_ratio !== undefined ? prod.designer_ratio : 20),
      packager: parseFloat(prod.packager_ratio !== undefined ? prod.packager_ratio : 60),
      platform: parseFloat(prod.platform_ratio !== undefined ? prod.platform_ratio : 20)
    };
    if (variantName && prod.items_json) {
      try {
        const arr = typeof prod.items_json === 'string' ? JSON.parse(prod.items_json) : (prod.items_json || []);
        const v = arr.find(x => (x.name || '') === variantName);
        if (v) {
          ratios = {
            designer: parseFloat(v.designer_ratio !== undefined ? v.designer_ratio : ratios.designer),
            packager: parseFloat(v.packager_ratio !== undefined ? v.packager_ratio : ratios.packager),
            platform: parseFloat(v.platform_ratio !== undefined ? v.platform_ratio : ratios.platform)
          };
        }
      } catch(e) {}
    }
    return ratios;
  }

  let shipmentProducts = [];
  let shipmentEditMode = false;

  async function openOrderShipmentModal(orderId) {
    const order = adminOrdersList.find(o => String(o.id) === String(orderId));
    if (!order) return;
    currentShipmentOrder = order;
    shipmentEditMode = order.status === 'SHIPPED' || order.status === 'COMPLETED';
    document.getElementById('shipment-order-id').value = order.id;

    await Promise.all([ensureProductsLoaded(), ensureUsersLoaded(), loadMaterialUnitCosts(), loadMaterialNamesForDatalist(), loadMaterialImages(), loadMaterialMeasureTypes()]);

    let items = [];
    try {
      items = typeof order.items_json === 'string' ? JSON.parse(order.items_json || '[]') : (order.items_json || []);
    } catch(e) { items = []; }
    if (!Array.isArray(items) || items.length === 0) {
      items = [{ id: null, name: `訂單作品 #${order.id}`, qty: 1, price: parseFloat(order.total_amount || 0) }];
    }

    shipmentProducts = items.map((itm, idx) => {
      const qty = parseInt(itm.qty || 1, 10) || 1;
      const unitPrice = roundInt(parseFloat(itm.price !== undefined ? itm.price : ((order.total_amount || 0) / qty)) || 0);
      const ratios = resolveProductRatios(itm);
      return {
        idx: idx,
        productId: itm.id || null,
        itemName: itm.name || itm.product_name || '-',
        variantName: (itm.variant_name || itm.item_name || ''),
        qty: qty,
        unitPrice: unitPrice,
        salesAmount: roundInt(qty * unitPrice),
        materials: [],
        otherCost: 0,
        shippingCost: idx === 0 ? 60 : 0,
        netProfit: 0,
        designerId: '',
        packagerId: '',
        designerRatio: ratios.designer,
        packagerRatio: ratios.packager,
        platformRatio: ratios.platform,
        designerAmount: 0,
        packagerAmount: 0,
        platformAmount: 0
      };
    });

    renderShipmentProducts();
    calculateShipmentNetProfit();

    const modal = document.getElementById('modal-order-shipment');
    if (modal) modal.classList.remove('hidden');

    const submitBtn = document.getElementById('shipment-submit-btn');
    if (submitBtn) {
      submitBtn.innerHTML = shipmentEditMode
        ? '<span class="material-symbols-outlined text-sm">save</span> 儲存修改'
        : '<span class="material-symbols-outlined text-sm">mark_email_read</span> 確認計算並執行寄送';
    }

    if (shipmentEditMode) {
      await prefillShipmentFromSaved(order.id);
    }
  }

  async function prefillShipmentFromSaved(orderId) {
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/settlement`);
      const json = await res.json();
      if (json.status !== 'success') return;
      const d = json.data || {};
      const sels = d.settlements || [];
      const mats = d.materials || [];
      shipmentProducts.forEach(p => {
        const key = (p.variantName || p.itemName || '');
        const sel = sels.find(s => String(s.product_id || '') === String(p.productId || '') && (s.item_name || '') === key);
        if (sel) {
          p.designerId = sel.designer_user_id || '';
          p.packagerId = sel.packager_user_id || '';
          p.otherCost = parseFloat(sel.other_cost || 0);
          p.shippingCost = parseFloat(sel.shipping_cost || 0);
          if (sel.designer_ratio) p.designerRatio = parseFloat(sel.designer_ratio);
          if (sel.packager_ratio) p.packagerRatio = parseFloat(sel.packager_ratio);
          if (sel.platform_ratio) p.platformRatio = parseFloat(sel.platform_ratio);
          p.materials = mats.filter(m => String(m.product_id || '') === String(p.productId || '') && (m.item_name || '') === key);
        }
      });
      renderShipmentProducts();
      calculateShipmentNetProfit();
    } catch(e) { console.error(e); }
  }

  function updateShipmentProductQty(idx, val) {
    if (!shipmentProducts[idx]) return;
    let qty = parseInt(val, 10);
    if (isNaN(qty) || qty <= 0) qty = 1;
    if (qty > 999) qty = 999;
    shipmentProducts[idx].qty = qty;
    shipmentProducts[idx].salesAmount = roundInt(qty * shipmentProducts[idx].unitPrice);
    renderShipmentProducts();
    calculateShipmentNetProfit();
  }

  function updateShipmentProductPrice(idx, val) {
    if (!shipmentProducts[idx]) return;
    shipmentProducts[idx].unitPrice = roundInt(parseFloat(val || 0));
    shipmentProducts[idx].salesAmount = roundInt(shipmentProducts[idx].qty * shipmentProducts[idx].unitPrice);
    renderShipmentProducts();
    calculateShipmentNetProfit();
  }

  function renderShipmentProducts() {
    const container = document.getElementById('shipment-products-container');
    if (!container) return;
    const users = getEligibleUsers();

    container.innerHTML = shipmentProducts.map((p, idx) => `
      <div class="border border-outline-variant rounded-lg bg-surface-container-low p-3 space-y-3">
        <div class="flex justify-between items-center border-b border-outline-variant/60 pb-2">
          <div class="font-bold text-white text-sm">
            <span class="text-primary-fixed font-mono">#${idx + 1}</span> ${p.itemName}
            ${shipmentEditMode
              ? `<span class="inline-flex items-center gap-1 text-[10px] text-gray-400 font-normal">x
                  <input type="number" min="1" max="999" value="${p.qty}" onchange="updateShipmentProductQty(${idx}, this.value)" class="w-14 bg-surface-container border border-outline-variant text-white text-center rounded outline-none p-0.5" />
                  件 · 單價 $<input type="number" min="0" step="0.01" value="${p.unitPrice}" onchange="updateShipmentProductPrice(${idx}, this.value)" class="w-20 bg-surface-container border border-outline-variant text-white text-center rounded outline-none p-0.5" />
                </span>`
              : `<span class="text-[10px] text-gray-400 font-normal">x ${p.qty} 件 · 單價 $${p.unitPrice}</span>`}
          </div>
          <div class="text-primary-fixed font-black text-sm">銷售 $${p.salesAmount}</div>
        </div>

        <div class="space-y-1.5">
          <div class="flex justify-between items-center">
            <span class="font-bold text-cyan-400 text-[11px]">耗材消耗明細（成本 = 消耗量 × 加權單位成本）</span>
            <button type="button" onclick="addShipmentMaterialRow(${idx})" class="px-2 py-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-[11px] rounded">+ 新增耗材</button>
          </div>
          <table class="w-full text-left text-xs">
            <thead class="text-gray-400 border-b border-outline-variant/60">
              <tr>
                <th class="p-1.5">耗材名稱</th>
                <th class="p-1.5 text-center w-28">消耗量</th>
                <th class="p-1.5 text-right w-28">單位成本</th>
                <th class="p-1.5 text-right w-28">成本 ($)</th>
                <th class="p-1.5 text-center w-10"></th>
              </tr>
            </thead>
            <tbody id="shipment-materials-tbody-${idx}"></tbody>
          </table>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-gray-300 mb-1">其它成本 ($)</label>
            <input type="number" step="0.01" id="shipment-other-cost-${idx}" value="${p.otherCost}" oninput="calculateShipmentNetProfit()" onchange="roundShipmentInput(this)" class="w-full bg-surface-container border border-outline-variant text-white p-1 rounded text-xs outline-none" />
          </div>
          <div>
            <label class="block text-[10px] font-bold text-gray-300 mb-1">郵寄成本 ($)</label>
            <input type="number" step="0.01" id="shipment-shipping-cost-${idx}" value="${p.shippingCost}" oninput="calculateShipmentNetProfit()" onchange="roundShipmentInput(this)" class="w-full bg-surface-container border border-outline-variant text-white p-1 rounded text-xs outline-none" />
          </div>
          <div class="p-1.5 bg-line-green/10 rounded border border-line-green/40">
            <div class="text-[10px] font-bold text-line-green mb-1">淨利潤 ($)</div>
            <div id="shipment-net-profit-${idx}" class="font-black text-line-green text-sm">$0</div>
          </div>
          <div class="p-1.5 bg-surface-container rounded border border-outline-variant">
            <div class="text-[10px] font-bold text-gray-400 mb-1">平台抽取金 ($)</div>
            <div id="shipment-platform-amount-${idx}" class="font-black text-gray-300 text-sm">$0</div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-primary-fixed mb-1">設計者（${p.designerRatio}%）</label>
            <select id="shipment-designer-${idx}" onchange="shipmentProducts[${idx}].designerId = this.value; calculateShipmentNetProfit()" class="w-full bg-surface-container border border-outline-variant text-white p-1.5 rounded text-xs outline-none">
              <option value="">請選擇設計者</option>
              ${users.map(u => `<option value="${u.id}" ${String(p.designerId) === String(u.id) ? 'selected' : ''}>${u.name} (${u.role === 'admin' ? '最高管理員' : '助理教練'})</option>`).join('')}
            </select>
            <div class="mt-1 p-1.5 bg-surface-container rounded border border-outline-variant text-center">
              <div class="text-[10px] font-bold text-primary-fixed mb-0.5">設計者金額</div>
              <div id="shipment-designer-amount-${idx}" class="font-black text-primary-fixed">$0</div>
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-secondary-container mb-1">包裝人員（${p.packagerRatio}%）</label>
            <select id="shipment-packager-${idx}" onchange="shipmentProducts[${idx}].packagerId = this.value; calculateShipmentNetProfit()" class="w-full bg-surface-container border border-outline-variant text-white p-1.5 rounded text-xs outline-none">
              <option value="">請選擇包裝人員</option>
              ${users.map(u => `<option value="${u.id}" ${String(p.packagerId) === String(u.id) ? 'selected' : ''}>${u.name} (${u.role === 'admin' ? '最高管理員' : '助理教練'})</option>`).join('')}
            </select>
            <div class="mt-1 p-1.5 bg-surface-container rounded border border-outline-variant text-center">
              <div class="text-[10px] font-bold text-secondary-container mb-0.5">包裝人員金額</div>
              <div id="shipment-packager-amount-${idx}" class="font-black text-secondary-container">$0</div>
            </div>
          </div>
        </div>
      </div>
    `).join('');

    shipmentProducts.forEach((p, idx) => {
      const tbody = document.getElementById(`shipment-materials-tbody-${idx}`);
      if (tbody && p.materials && p.materials.length > 0) {
        p.materials.forEach(m => addShipmentMaterialRow(idx, m));
      }
    });
  }

  function addShipmentMaterialRow(idx, prefill) {
    const tbody = document.getElementById('shipment-materials-tbody-' + idx);
    if (!tbody) return;
    const rowId = 'sm-' + idx + '-' + Date.now() + '-' + Math.floor(Math.random()*1000);
    const tr = document.createElement('tr');
    tr.id = rowId;
    const matNames = (function(){
      const list = document.getElementById('mat-name-list');
      if (!list) return [];
      return Array.from(list.options).map(o => o.value);
    })();
    tr.innerHTML = `
      <td class="p-1.5 relative">
        <div class="flex items-center gap-2">
          <input type="text" class="shipment-mat-name flex-1 min-w-0 bg-surface-container border border-outline-variant text-white p-1 rounded outline-none text-xs" placeholder="點選或輸入關鍵字搜尋耗材" onfocus="onMaterialSearchInput(event, '${rowId}')" oninput="onMaterialSearchInput(event, '${rowId}')" onchange="recalcShipmentMaterialRow(${idx}, '${rowId}')" onblur="setTimeout(() => hideMaterialSuggest('${rowId}'), 150)" />
          <img class="shipment-mat-img w-12 h-12 object-cover rounded border border-outline-variant hidden cursor-zoom-in" alt="耗材圖片" onmouseenter="showMaterialZoom(this)" onmousemove="moveMaterialZoom(event)" onmouseleave="hideMaterialZoom()" />
        </div>
        <div class="shipment-mat-suggest hidden absolute left-0 right-0 top-full mt-0.5 max-h-44 overflow-y-auto bg-surface-container-high border border-outline-variant rounded-lg shadow-2xl z-30 text-xs"></div>
      </td>
      <td class="p-1.5 text-center">
        <input type="number" step="1" min="0" class="shipment-mat-qty w-full bg-surface-container border border-outline-variant text-cyan-300 font-bold p-1 text-center rounded outline-none text-xs" value="150" placeholder="消耗容量" oninput="recalcShipmentMaterialRow(0, '${rowId}')" />
      </td>
      <td class="p-1.5 text-right">
        <input type="number" step="0.0001" readonly class="shipment-mat-unit-cost w-full bg-surface-container border border-outline-variant text-cyan-200 font-bold p-1 text-right rounded outline-none text-xs" value="0.0000" title="加權平均單位成本（自動帶入）" />
      </td>
      <td class="p-1.5 text-right">
        <input type="number" step="0.01" readonly class="shipment-mat-cost w-full bg-surface-container border border-outline-variant text-amber-400 font-bold p-1 text-right rounded outline-none text-xs" value="0.00" title="成本 = 消耗容量 × 加權單位成本（自動計算）" />
      </td>
      <td class="p-1.5 text-center">
        <button type="button" onclick="removeShipmentMaterialRow(${idx}, '${rowId}')" class="text-error font-bold text-xs hover:underline">✕</button>
      </td>
    `;
    if (prefill) {
      const nameInput = tr.querySelector('.shipment-mat-name');
      const qtyInput = tr.querySelector('.shipment-mat-qty');
      if (nameInput && prefill.material_name) nameInput.value = prefill.material_name;
      if (qtyInput) {
        const cap = parseFloat(prefill.capacity_used || 0);
        const qty = parseFloat(prefill.qty_used || 0);
        qtyInput.value = cap > 0 ? cap : qty;
      }
    }
    tbody.appendChild(tr);
    recalcShipmentMaterialRow(idx, rowId);
  }

  function recalcShipmentMaterialRow(idx, rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const name = tr.querySelector('.shipment-mat-name').value.trim();
    const amount = parseFloat(tr.querySelector('.shipment-mat-qty').value || 0);
    const measureType = (name && materialMeasureTypes[name]) || 'capacity';
    const amountInput = tr.querySelector('.shipment-mat-qty');
    if (amountInput) {
      amountInput.placeholder = measureType === 'quantity' ? '消耗數量' : '消耗容量';
      amountInput.title = measureType === 'quantity' ? '消耗數量' : '消耗容量';
    }
    const unitCost = materialUnitCosts[name] || 0;
    tr.querySelector('.shipment-mat-unit-cost').value = unitCost.toFixed(4);
    const cost = amount * unitCost;
    tr.querySelector('.shipment-mat-cost').value = roundInt(cost);
    const img = tr.querySelector('.shipment-mat-img');
    const imageUrl = materialImages[name] || '';
    if (img) {
      if (imageUrl) {
        img.src = imageUrl;
        img.classList.remove('hidden');
      } else {
        img.removeAttribute('src');
        img.classList.add('hidden');
      }
    }
    calculateShipmentNetProfit();
  }

  function removeShipmentMaterialRow(idx, rowId) {
    const tr = document.getElementById(rowId);
    if (tr) tr.remove();
    calculateShipmentNetProfit();
  }

  function showMaterialZoom(imgEl) {
    const zoom = document.getElementById('shipment-material-zoom');
    if (!zoom || !imgEl || !imgEl.src) return;
    zoom.src = imgEl.src;
    zoom.classList.remove('hidden');
  }

  function moveMaterialZoom(e) {
    const zoom = document.getElementById('shipment-material-zoom');
    if (!zoom || zoom.classList.contains('hidden')) return;
    const pad = 16;
    const w = zoom.offsetWidth || 288;
    const h = zoom.offsetHeight || 288;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
    zoom.style.left = x + 'px';
    zoom.style.top = y + 'px';
  }

  function hideMaterialZoom() {
    const zoom = document.getElementById('shipment-material-zoom');
    if (zoom) zoom.classList.add('hidden');
  }

  function onMaterialSearchInput(e, rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const input = tr.querySelector('.shipment-mat-name');
    const suggest = tr.querySelector('.shipment-mat-suggest');
    if (!input || !suggest) return;
    const kw = (input.value || '').trim().toLowerCase();
    const pool = Array.from(new Set([...(materialNameList || []), ...Object.keys(materialUnitCosts || {})]));
    if (pool.length === 0) {
      suggest.classList.add('hidden');
      suggest.innerHTML = '';
      return;
    }
    const matches = kw
      ? pool.filter(n => n.toLowerCase().includes(kw)).slice(0, 20)
      : pool.slice(0, 20);
    if (matches.length === 0) {
      suggest.innerHTML = `<div class="px-3 py-2 text-gray-400 italic">無符合的耗材</div>`;
      suggest.classList.remove('hidden');
      return;
    }
    suggest.innerHTML = matches.map(n => {
      const cost = materialUnitCosts[n];
      const img = materialImages[n];
      const safeName = n.replace(/\\/g, '\\\\').replace(/"/g, '&quot;');
      return `<div class="px-3 py-2 hover:bg-surface-container cursor-pointer flex items-center gap-2 border-b border-outline-variant/40" data-name="${safeName}" onmousedown="selectMaterialSuggestion(this, '${rowId}')">
        ${img ? `<img src="${img}" class="w-7 h-7 object-cover rounded border border-outline-variant" />` : ''}
        <span class="font-bold text-white">${n}</span>
        ${cost !== undefined ? `<span class="ml-auto text-cyan-300 text-[10px]">單價 $${Number(cost).toFixed(4)}</span>` : ''}
      </div>`;
    }).join('');
    suggest.classList.remove('hidden');
  }

  function selectMaterialSuggestion(el, rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const name = el.getAttribute('data-name');
    const input = tr.querySelector('.shipment-mat-name');
    const suggest = tr.querySelector('.shipment-mat-suggest');
    if (input && name) {
      input.value = name;
      if (suggest) {
        suggest.classList.add('hidden');
        suggest.innerHTML = '';
      }
      recalcShipmentMaterialRow(0, rowId);
    }
  }

  function hideMaterialSuggest(rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const suggest = tr.querySelector('.shipment-mat-suggest');
    if (suggest) suggest.classList.add('hidden');
  }

  function round2(v) { return Math.round((v + Number.EPSILON) * 100) / 100; }

  function roundInt(v) { return Math.round((v + Number.EPSILON)); }

  function roundShipmentInput(el) {
    if (!el) return;
    const v = parseFloat(el.value || 0);
    el.value = roundInt(isNaN(v) ? 0 : v);
    calculateShipmentNetProfit();
  }

  function calculateShipmentNetProfit() {
    if (!currentShipmentOrder) return;

    let totals = { sales: 0, material: 0, other: 0, shipping: 0, net: 0, designer: 0, packager: 0, platform: 0 };

    shipmentProducts.forEach((p, idx) => {
      let materialCost = 0;
      const tbody = document.getElementById('shipment-materials-tbody-' + idx);
      if (tbody) {
        tbody.querySelectorAll('.shipment-mat-cost').forEach(inp => {
          materialCost += parseFloat(inp.value || 0);
        });
      }
      const otherCost = parseFloat(document.getElementById('shipment-other-cost-' + idx).value || 0);
      const shippingCost = parseFloat(document.getElementById('shipment-shipping-cost-' + idx).value || 0);
      const netProfit = p.salesAmount - materialCost - otherCost - shippingCost;

      const rawDesigner = netProfit * (p.designerRatio / 100);
      const rawPackager = netProfit * (p.packagerRatio / 100);
      const rawPlatform = netProfit * (p.platformRatio / 100);

      p.materialCost = roundInt(materialCost);
      p.otherCost = roundInt(otherCost);
      p.shippingCost = roundInt(shippingCost);
      p.netProfit = roundInt(netProfit);
      p.designerAmount = p.designerId ? roundInt(rawDesigner) : 0;
      p.packagerAmount = p.packagerId ? roundInt(rawPackager) : 0;
      p.platformAmount = roundInt(rawPlatform + (p.designerId ? 0 : rawDesigner) + (p.packagerId ? 0 : rawPackager));

      document.getElementById('shipment-net-profit-' + idx).textContent = '$' + p.netProfit;
      document.getElementById('shipment-designer-amount-' + idx).textContent = '$' + p.designerAmount;
      document.getElementById('shipment-packager-amount-' + idx).textContent = '$' + p.packagerAmount;
      document.getElementById('shipment-platform-amount-' + idx).textContent = '$' + p.platformAmount;

      totals.sales += p.salesAmount;
      totals.material += p.materialCost;
      totals.other += p.otherCost;
      totals.shipping += p.shippingCost;
      totals.net += p.netProfit;
      totals.designer += p.designerAmount;
      totals.packager += p.packagerAmount;
      totals.platform += p.platformAmount;
    });

    document.getElementById('shipment-total-sales').textContent = '$' + roundInt(totals.sales);
    document.getElementById('shipment-total-material-cost').textContent = '$' + roundInt(totals.material);
    document.getElementById('shipment-total-other-cost').textContent = '$' + roundInt(totals.other);
    document.getElementById('shipment-total-shipping-cost').textContent = '$' + roundInt(totals.shipping);
    document.getElementById('shipment-total-net-profit').textContent = '$' + roundInt(totals.net);
    document.getElementById('shipment-total-designer').textContent = '$' + roundInt(totals.designer);
    document.getElementById('shipment-total-packager').textContent = '$' + roundInt(totals.packager);
    document.getElementById('shipment-total-platform').textContent = '$' + roundInt(totals.platform);
  }

  async function submitOrderShipmentConfirm() {
    if (!currentShipmentOrder) return;
    const orderId = currentShipmentOrder.id;

    const productsPayload = shipmentProducts.map(p => {
      const materials = [];
      const tbody = document.getElementById('shipment-materials-tbody-' + p.idx);
      if (tbody) {
        tbody.querySelectorAll('tr').forEach(tr => {
          const name = tr.querySelector('.shipment-mat-name').value.trim();
          const amount = parseFloat(tr.querySelector('.shipment-mat-qty').value || 0);
          const cost = parseFloat(tr.querySelector('.shipment-mat-cost').value || 0);
          const unitCost = name ? (materialUnitCosts[name] || 0) : 0;
          const measureType = (name && materialMeasureTypes[name]) || 'capacity';
          if (name) {
            materials.push({
              material_name: name,
              capacity_used: measureType === 'capacity' ? amount : 0,
              qty_used: measureType === 'quantity' ? amount : 0,
              unit_cost: unitCost,
              cost: round2(cost)
            });
          }
        });
      }
      return {
        product_id: p.productId,
        item_name: p.variantName || p.itemName,
        sales_amount: round2(p.salesAmount),
        material_cost: p.materialCost || 0,
        other_cost: p.otherCost || 0,
        shipping_cost: p.shippingCost || 0,
        net_profit: p.netProfit || 0,
        designer_user_id: p.designerId || null,
        packager_user_id: p.packagerId || null,
        designer_ratio: p.designerRatio,
        packager_ratio: p.packagerRatio,
        platform_ratio: p.platformRatio,
        designer_amount: p.designerAmount || 0,
        packager_amount: p.packagerAmount || 0,
        platform_amount: p.platformAmount || 0,
        materials: materials
      };
    });

    const body = { products: productsPayload };
    let url = `/api/admin/orders/${orderId}/ship`;
    if (shipmentEditMode) {
      url = `/api/admin/orders/${orderId}/update-shipment`;
      body.items = shipmentProducts.map(p => ({
        id: p.productId,
        name: p.itemName,
        variant_name: p.variantName,
        price: p.unitPrice,
        qty: p.qty
      }));
    }

    const t0 = Date.now();
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const elapsed = Date.now() - t0;

    const json = await res.json();
    if (json.status === 'success') {
      alert(shipmentEditMode
        ? `訂單 #${orderId} 已更新，結算與庫存已重新計算。（伺服器回應 ${elapsed} ms）`
        : `訂單 #${orderId} 已成功執行寄送！逐商品利潤結算與分潤已存檔。（伺服器回應 ${elapsed} ms）`);
      closeModal('modal-order-shipment');
      shipmentEditMode = false;
      loadAdminOrdersList();
    } else {
      alert((json.message || '執行寄送失敗') + `（伺服器回應 ${elapsed} ms）`);
    }
  }

  async function cancelAdminOrder(orderId) {
    if (!confirm(`確定取消訂單 #${orderId}？取消後會釋放庫存。`)) return;
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/cancel`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: '{}'
      });
      const json = await res.json();
      alert(json.message || (json.status === 'success' ? '訂單已取消' : '取消失敗'));
    } catch(e) {
      alert(`取消訂單失敗：${e.message || e}`);
    }
    loadAdminOrdersList();
  }

  // --- 修改訂單 ---
  let currentEditOrder = null;
  let currentEditOrderItems = [];

  function editAdminOrder(orderId) {
    const order = adminOrdersList.find(o => String(o.id) === String(orderId));
    if (!order) return;
    const isShipped = order.status === 'SHIPPED' || order.status === 'COMPLETED';
    if (isShipped) {
      openOrderShipmentModal(order.id);
      return;
    }
    currentEditOrder = order;
    document.getElementById('order-edit-id').textContent = order.id;

    let items = [];
    try {
      items = typeof order.items_json === 'string' ? JSON.parse(order.items_json || '[]') : (order.items_json || []);
    } catch(e) { items = []; }
    if (!Array.isArray(items) || items.length === 0) {
      items = [{ id: null, name: `訂單作品 #${order.id}`, price: parseFloat(order.total_amount || 0), qty: 1, variant_name: '' }];
    }

    currentEditOrderItems = items.map((itm, i) => {
      const qty = parseInt(itm.qty || 1, 10) || 1;
      const price = parseFloat(itm.price !== undefined ? itm.price : ((order.total_amount || 0) / qty));
      return {
        idx: i,
        id: itm.id || itm.product_id || null,
        name: itm.name || itm.product_name || '-',
        variantName: itm.variant_name || itm.item_name || '',
        price: round2(isNaN(price) ? 0 : price),
        qty: qty
      };
    });

    renderOrderEditItems();
    document.getElementById('modal-order-edit').classList.remove('hidden');
  }

  function renderOrderEditItems() {
    const container = document.getElementById('order-edit-items-container');
    if (!container) return;
    container.innerHTML = currentEditOrderItems.map((itm, i) => `
      <div class="border border-outline-variant rounded-lg bg-surface-container-low p-3 grid grid-cols-1 md:grid-cols-4 gap-2 items-end">
        <div class="md:col-span-2">
          <label class="block text-[10px] font-bold text-gray-300 mb-1">商品名稱 / 款式</label>
          <div class="text-white text-xs font-bold p-2 bg-surface-container rounded border border-outline-variant">${itm.name}${itm.variantName ? ' (' + itm.variantName + ')' : ''}</div>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-primary-fixed mb-1">單價金額 ($)</label>
          <input type="number" step="0.01" min="0" value="${itm.price}" oninput="updateEditOrderItemPrice(${i}, this.value)" onchange="roundShipmentInput(this)" class="w-full bg-surface-container border border-outline-variant text-primary-fixed font-bold p-2 rounded text-xs outline-none" />
        </div>
        <div>
          <label class="block text-[10px] font-bold text-secondary-container mb-1">數量</label>
          <input type="number" step="1" min="1" value="${itm.qty}" oninput="updateEditOrderItemQty(${i}, this.value)" class="w-full bg-surface-container border border-outline-variant text-secondary-container font-bold p-2 rounded text-xs outline-none" />
        </div>
      </div>
    `).join('');
    recalcOrderEditTotal();
  }

  function updateEditOrderItemPrice(idx, v) {
    if (currentEditOrderItems[idx]) currentEditOrderItems[idx].price = round2(parseFloat(v || 0));
    recalcOrderEditTotal();
  }

  function updateEditOrderItemQty(idx, v) {
    if (currentEditOrderItems[idx]) currentEditOrderItems[idx].qty = parseInt(v || 1, 10) || 1;
    recalcOrderEditTotal();
  }

  function recalcOrderEditTotal() {
    const total = currentEditOrderItems.reduce((sum, itm) => sum + itm.price * itm.qty, 0);
    const el = document.getElementById('order-edit-total');
    if (el) el.textContent = '$' + round2(total).toFixed(2);
  }

  async function saveOrderEditSubmit() {
    if (!currentEditOrder) return;
    const payload = {
      items: currentEditOrderItems.map(itm => ({
        id: itm.id,
        name: itm.name,
        variant_name: itm.variantName,
        price: itm.price,
        qty: itm.qty
      }))
    };
    try {
      const res = await fetch(`/api/admin/orders/${currentEditOrder.id}/update`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.status === 'success') {
        alert(json.message || '訂單修改成功！');
        closeModal('modal-order-edit');
        currentEditOrder = null;
        loadAdminOrdersList();
      } else {
        alert(json.message || '修改訂單失敗');
      }
    } catch(e) {
      alert(`修改訂單失敗：${e.message || e}`);
    }
  }

  // --- Bonus 獎金統計 ---
  let bonusSummaryData = { platform_total: 0, members: [], entries: [] };

  function defaultBonusRange() {
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const pad = n => String(n).padStart(2, '0');
    const fromEl = document.getElementById('bonus-from');
    const toEl = document.getElementById('bonus-to');
    if (fromEl) fromEl.value = `${first.getFullYear()}-${pad(first.getMonth() + 1)}-${pad(first.getDate())}`;
    if (toEl) toEl.value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }

  function populateBonusMemberFilter() {
    const sel = document.getElementById('bonus-member-filter');
    if (!sel) return;
    const users = (usersList || []).filter(u => u.role === 'admin' || u.role === 'assistant_coach');
    const current = sel.value;
    sel.innerHTML = '<option value="">全部同仁</option>' + users.map(u =>
      `<option value="${u.id}">${u.name} (${u.role === 'admin' ? '最高管理員' : '助理教練'})</option>`
    ).join('');
    sel.value = current;
  }

  async function loadBonusSummary() {
    const from = document.getElementById('bonus-from').value;
    const to = document.getElementById('bonus-to').value;
    if (!from || !to) return alert('請選擇開始與結束日期');
    populateBonusMemberFilter();
    try {
      const res = await fetch(`/api/admin/bonuses?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
      const json = await res.json();
      if (json.status === 'success') {
        bonusSummaryData = json;
        renderBonusSummary();
      }
    } catch(e) { console.error(e); }
  }

  function renderBonusSummary() {
    const d = bonusSummaryData;
    const filterUserId = document.getElementById('bonus-member-filter') ? document.getElementById('bonus-member-filter').value : '';
    let members = d.members || [];
    let entries = d.entries || [];
    if (filterUserId) {
      members = members.filter(m => m.user_id === filterUserId);
      entries = entries.filter(e => e.user_id === filterUserId);
    }
    document.getElementById('bonus-platform-total').textContent = '$' + parseFloat(d.platform_total || 0).toFixed(2);
    const membersTotal = members.reduce((a, m) => a + parseFloat(m.total || 0), 0);
    document.getElementById('bonus-members-total').textContent = '$' + membersTotal.toFixed(2);
    const settlementCount = filterUserId
      ? new Set(entries.map(e => e.order_id)).size
      : (d.settlement_count !== undefined ? d.settlement_count : new Set((d.entries || []).map(e => e.order_id)).size);
    document.getElementById('bonus-entries-count').textContent = settlementCount;

    const tbody = document.getElementById('bonus-members-tbody');
    if (!tbody) return;
    if (members.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400 italic">此期間沒有結算獎金</td></tr>`;
      return;
    }
    tbody.innerHTML = members.map(m => `
      <tr class="hover:bg-surface-container/50">
        <td class="p-3 font-bold text-white">${m.name}</td>
        <td class="p-3 text-right text-primary-fixed font-bold">$${parseFloat(m.designer_amount || 0).toFixed(2)}</td>
        <td class="p-3 text-right text-secondary-container font-bold">$${parseFloat(m.packager_amount || 0).toFixed(2)}</td>
        <td class="p-3 text-right text-line-green font-black">$${parseFloat(m.total || 0).toFixed(2)}</td>
        <td class="p-3 text-right">
          <button onclick="openBonusDetail('${m.user_id}')" class="text-primary-fixed hover:underline font-bold">查看明細</button>
        </td>
      </tr>
    `).join('');
  }

  function openBonusDetail(userId) {
    const entries = (bonusSummaryData.entries || []).filter(e => e.user_id === userId);
    const member = (bonusSummaryData.members || []).find(m => m.user_id === userId);
    document.getElementById('bonus-detail-summary').textContent =
      `${member ? member.name : userId} 的獎金明細（共 ${entries.length} 筆）`;
    const list = document.getElementById('bonus-detail-list');
    if (entries.length === 0) {
      list.innerHTML = `<div class="text-xs text-gray-400 italic">無明細</div>`;
    } else {
      list.innerHTML = entries.map(e => `
        <div class="flex justify-between items-center p-3 bg-surface-container rounded border border-outline-variant">
          <div>
            <div class="font-bold text-white text-xs">${e.order_id} · ${e.item_name || '-'}</div>
            <div class="text-[10px] text-gray-400 mt-0.5">${e.settled_at || ''} · 角色: ${e.role === 'designer' ? '設計者' : '包裝人員'} · 比率 ${parseFloat(e.ratio || 0)}%</div>
          </div>
          <div class="text-line-green font-black text-sm">$${parseFloat(e.amount || 0).toFixed(2)}</div>
        </div>
      `).join('');
    }
    document.getElementById('modal-bonus-detail').classList.remove('hidden');
  }

</script>
