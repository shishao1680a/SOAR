<!-- SECTION: ORDERS (訂單資訊管理) -->
<div id="sec-orders" class="hidden space-y-6">
  <div class="flex justify-between items-center flex-wrap gap-4">
    <div>
      <h2 class="font-display-lg text-2xl italic font-black text-white flex items-center gap-2">
        <span class="material-symbols-outlined text-primary-fixed">shopping_bag</span> 訂單資訊管理
      </h2>
      <p class="font-label-caps text-xs text-on-surface-variant">查看線上訂單紀錄、發送狀態與耗材淨利潤精準結算試算。</p>
    </div>
    <button onclick="loadAdminOrdersList()" class="px-3.5 py-2 bg-surface-container-high border border-outline-variant text-white font-label-caps text-xs font-bold italic flex items-center gap-1 hover:border-primary-fixed transition-all">

  <div class="bg-surface-container-low border border-outline-variant overflow-x-auto shadow-2xl">

          <th class="p-3">訂單編號</th>

          <th class="p-3">狀態 / 淨利潤</th>

      </thead>
      <tbody id="orders-table-body" class="divide-y divide-outline-variant/40">
        <!-- Dynamically rendered -->
      </tbody>
    </table>
  </div>
</div>
