<!-- SECTION: ORDERS (訂單資訊管理) -->
<div id="sec-orders" class="hidden space-y-6">
  <div class="flex justify-between items-center flex-wrap gap-4">
    <div>
      <h2 class="font-display-lg text-2xl italic font-black text-white flex items-center gap-2">
        <span class="material-symbols-outlined text-primary-fixed">shopping_bag</span> 訂單資訊管理
      </h2>
      <p class="font-label-caps text-xs text-on-surface-variant">查看線上訂單紀錄、發送狀態與耗材淨利潤精準結算試算。</p>
    </div>
    <div class="flex gap-2">
      <button onclick="openPrintTestModal()" class="px-3.5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-label-caps text-xs font-bold italic flex items-center gap-1 shadow">
        <span class="material-symbols-outlined text-sm">print</span> 🖨 打印測試
      </button>
      <button onclick="loadAdminOrdersList()" class="px-3.5 py-2 bg-surface-container-high border border-outline-variant text-white font-label-caps text-xs font-bold italic flex items-center gap-1 hover:border-primary-fixed transition-all">
        <span class="material-symbols-outlined text-sm">refresh</span> 重新整理訂單
      </button>
    </div>
  </div>

  <div class="flex flex-wrap gap-2 border-b border-outline-variant pb-3">
    <button type="button" id="orders-tab-all" onclick="setOrdersStatusFilter('all')" class="px-4 py-2 rounded-t font-bold italic text-xs transition-all bg-primary-fixed text-on-primary-fixed">全部</button>
    <button type="button" id="orders-tab-pending" onclick="setOrdersStatusFilter('pending')" class="px-4 py-2 rounded-t font-bold italic text-xs transition-all bg-surface-container-high border border-outline-variant text-gray-300 hover:text-white">待處理</button>
    <button type="button" id="orders-tab-shipped" onclick="setOrdersStatusFilter('shipped')" class="px-4 py-2 rounded-t font-bold italic text-xs transition-all bg-surface-container-high border border-outline-variant text-gray-300 hover:text-white">已寄送</button>
    <button type="button" id="orders-tab-cancelled" onclick="setOrdersStatusFilter('cancelled')" class="px-4 py-2 rounded-t font-bold italic text-xs transition-all bg-surface-container-high border border-outline-variant text-gray-300 hover:text-white">已取消</button>
  </div>

  <div class="bg-surface-container-low border border-outline-variant rounded-xl p-3 flex flex-wrap items-center gap-2">
    <div class="flex-1 min-w-[220px] relative">
      <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-sm text-on-surface-variant">search</span>
      <input type="text" id="orders-search-input" oninput="setOrdersSearch(this.value)" placeholder="搜尋訂單編號、訂購人、LINE、商品名稱..." class="w-full bg-surface-container-high border border-outline-variant text-white font-label-caps text-xs p-2 pl-8 rounded outline-none focus:border-primary-fixed" />
    </div>
    <button onclick="document.getElementById('orders-search-input').value=''; setOrdersSearch('');" class="px-3 py-2 bg-surface-container-high border border-outline-variant text-gray-300 hover:text-white font-label-caps text-xs rounded">清除</button>
  </div>

  <div id="orders-cards-container" class="space-y-4"></div>
</div>
