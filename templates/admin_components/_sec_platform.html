<!-- SECTION: 平台收益 -->
<div id="sec-platform" class="hidden space-y-6">
  <div>
    <h2 class="font-display-lg text-2xl italic font-black text-white flex items-center gap-2">
      <span class="material-symbols-outlined text-primary-fixed">account_balance_wallet</span> 平台收益
    </h2>
    <p class="font-label-caps text-xs text-on-surface-variant">依結算時間統計各商品／項目的銷售、成本、淨利潤與平台抽取金</p>
  </div>

  <div class="bg-surface-container-low border border-outline-variant rounded-xl p-4 flex flex-wrap items-end gap-3">
    <div>
      <label class="block text-xs font-bold text-gray-300 mb-1">開始日期</label>
      <input type="date" id="platform-from" class="bg-surface-container-high border border-outline-variant text-white font-label-caps text-xs p-2 rounded" />
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-300 mb-1">結束日期</label>
      <input type="date" id="platform-to" class="bg-surface-container-high border border-outline-variant text-white font-label-caps text-xs p-2 rounded" />
    </div>
    <button onclick="loadPlatformRevenueSummary()" class="px-4 py-2 bg-primary-fixed text-on-primary-fixed font-label-caps text-xs font-bold italic rounded shadow flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">search</span> 查詢
    </button>
  </div>

  <div class="bg-surface-container-low border border-outline-variant overflow-x-auto">
    <table class="w-full text-left font-label-caps text-xs">
      <thead class="bg-surface-container border-b border-outline-variant text-primary-fixed">
        <tr>
          <th class="p-3">商品名稱</th>
          <th class="p-3">項目名稱</th>
          <th class="p-3 text-right">總銷售金額</th>
          <th class="p-3 text-right">總耗材成本</th>
          <th class="p-3 text-right">總其它成本</th>
          <th class="p-3 text-right">總郵寄成本</th>
          <th class="p-3 text-right">總淨利潤</th>
          <th class="p-3 text-right">設計者金額</th>
          <th class="p-3 text-right">包裝人員金額</th>
          <th class="p-3 text-right">平台抽取金總額</th>
          <th class="p-3 text-right">操作</th>
        </tr>
      </thead>
      <tbody id="platform-revenue-tbody" class="divide-y divide-outline-variant/40">
        <tr><td colspan="11" class="p-4 text-center text-gray-400 italic">請選擇日期區間後查詢</td></tr>
      </tbody>
    </table>
  </div>
</div>
