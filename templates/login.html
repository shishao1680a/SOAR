<!DOCTYPE html>
<html class="dark" lang="zh-TW">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>展夢.飛翔 // 會員登入與註冊</title>
  <!-- Tailwind CSS（本地建置，取代 CDN） -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-login.css') }}">
  <!-- 2026-10-09 主人指定：字體與後台一致（Chakra Petch + Noto Sans TC） -->
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <style>
    body {
      background-color: #0b0f17;
      background-image: radial-gradient(#1b2436 1px, transparent 1px);
      background-size: 28px 28px;
      color: #e6edf7;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between font-body-md antialiased">

  <!-- Top Simple Nav Header -->
  <header class="p-4 md:px-12 bg-background/80 backdrop-blur-md border-b border-outline-variant flex justify-between items-center z-50">
    <a href="/" class="font-display-lg text-xl md:text-2xl italic font-black text-primary-fixed border-b-4 border-primary-fixed">
        展夢.飛翔 <span class="text-xs text-on-primary-fixed not-italic font-label-caps bg-primary-fixed px-2 py-0.5 rounded">會員專區</span>
    </a>
    <a href="/" class="text-xs font-label-caps text-on-surface-variant hover:text-primary-green flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">arrow_back</span> 返回首頁
    </a>
  </header>

  <!-- Login Card Container -->
  <main class="flex-grow flex items-center justify-center p-4 my-8">
    <div class="w-full max-w-lg bg-surface-container rounded-2xl p-8 md:p-10 shadow-2xl space-y-6 text-text-main border border-outline-variant">
      
      <!-- Card Title & Header -->
      <div class="text-center space-y-1">
        <h1 id="auth-card-title" class="text-3xl font-black text-primary-green tracking-tight font-body-md">會員登入</h1>
        <p id="auth-card-subtitle" class="text-sm text-on-surface-variant font-medium">使用 LINE 帳號快速登入，第一次登入會請你填寫基本資料</p>
      </div>

      <!-- LINE Pre-fill Alert Banner -->
      <div id="line-bind-banner" class="hidden p-3 bg-line-green/10 border border-line-green/40 rounded-xl text-xs text-line-green space-y-1">
        <div class="font-bold flex items-center gap-1">
          <svg class="w-4 h-4 fill-line-green shrink-0" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.82 2 10.5c0 3.32 2.27 6.22 5.67 7.5-.23.83-.84 3.03-.96 3.48-.15.56.2.55.43.4.18-.12 2.87-1.95 4.04-2.75.92.17 1.86.27 2.82.27 5.52 0 10-3.82 10-8.5S17.52 2 12 2z"/></svg>
          已完成 LINE 登入授權！請填寫以下基本資料，即可完成註冊並登入。
        </div>
      </div>

      <!-- Mode Switcher Tabs（2026-10-10 主人指定：只保留 LINE 登入，整排頁籤隱藏；程式保留，移除 style 即可恢復） -->
      <div style="display:none" class="flex bg-surface-container-high p-1 rounded-xl text-sm font-bold">
        <button id="btn-tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-lg bg-primary-fixed text-on-primary-fixed transition-all">
          帳密登入
        </button>
        <button id="btn-tab-bind" onclick="switchAuthTab('bind')" class="hidden flex-1 py-2 rounded-lg text-on-surface-variant hover:text-primary-green transition-all">
          帳號綁定
        </button>
        <button id="btn-tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 rounded-lg text-on-surface-variant hover:text-primary-green transition-all">
          建立會員帳號
        </button>
      </div>

      <!-- LINE Login（2026-10-10 主人指定：唯一的登入入口） -->
      <div class="space-y-3 pt-1">
        <button onclick="handleLineLogin()" class="w-full bg-line-green hover:bg-line-green-hover text-white py-3.5 rounded-xl font-bold text-base shadow-lg shadow-line-green/20 flex items-center justify-center gap-2 active:scale-[0.99] transition-all">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.82 2 10.5c0 3.32 2.27 6.22 5.67 7.5-.23.83-.84 3.03-.96 3.48-.15.56.2.55.43.4.18-.12 2.87-1.95 4.04-2.75.92.17 1.86.27 2.82.27 5.52 0 10-3.82 10-8.5S17.52 2 12 2z"/></svg>
          使用 LINE 帳號登入
        </button>
        <p class="text-center text-[11px] text-on-surface-variant leading-relaxed">
          沒有 LINE 帳號也可以免費申請。第一次登入時會請你填寫姓名、手機與寄送地址。
        </p>
      </div>

      <!-- FORM 1: LOGIN (帳密登入：2026-10-10 主人指定隱藏，程式保留) -->
      <div id="form-login" style="display:none" class="space-y-4 pt-2">
        <div>
          <label class="block text-xs font-bold text-on-surface-variant mb-1.5">手機電話 / 帳號</label>
          <input type="text" id="login-username" placeholder="請輸入手機電話或帳號" class="w-full bg-surface-container-high border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface focus:bg-surface-container-high focus:border-primary-green focus:ring-2 focus:ring-primary-green/20 outline-none transition-all font-medium"/>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-xs font-bold text-on-surface-variant">密碼</label>
            <span class="text-[11px] text-on-surface-variant">* 請輸入您的登入密碼</span>
          </div>
          <input type="password" id="login-password" placeholder="請輸入密碼" class="w-full bg-surface-container-high border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface focus:border-primary-green focus:ring-2 focus:ring-primary-green/20 outline-none transition-all"/>
        </div>

        <!-- Main Login Button -->
        <button onclick="handleLoginSubmit()" class="w-full bg-primary-fixed hover:bg-primary-green-hover text-on-primary-fixed py-3.5 rounded-xl font-bold text-base shadow-lg shadow-primary-green/20 hover:shadow-primary-green/40 active:scale-[0.99] transition-all">
          登入
        </button>

        <div class="text-center pt-2">
          <button onclick="switchAuthTab('register')" class="text-xs text-on-surface-variant hover:text-primary-green font-bold hover:underline">
            還沒有帳號？點此前往【建立會員帳號】 ➔
          </button>
        </div>
      </div>

      <!-- FORM 2: BIND ACCOUNT (LINE 帳號綁定畫面，對應需求 1) -->
      <div id="form-bind" style="display:none" class="hidden space-y-4 pt-2">
        <input type="hidden" id="bind-line-id" />
        <input type="hidden" id="bind-avatar-url" />

        <div class="p-3 bg-surface-container-high border border-outline-variant rounded-xl text-xs text-on-surface-variant">
          請輸入您先前已註冊的手機電話/帳號與密碼，完成與 LINE 帳號的連結綁定。
        </div>

        <div>
          <label class="block text-xs font-bold text-on-surface-variant mb-1.5">已註冊的手機電話 / 帳號 *</label>
          <input type="text" id="bind-username" placeholder="請輸入您原有的手機電話或帳號" class="w-full bg-surface-container-high border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface focus:border-primary-green focus:ring-2 focus:ring-primary-green/20 outline-none transition-all"/>
        </div>

        <div>
          <label class="block text-xs font-bold text-on-surface-variant mb-1.5">密碼 *</label>
          <input type="password" id="bind-password" placeholder="請輸入密碼" class="w-full bg-surface-container-high border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface focus:border-primary-green focus:ring-2 focus:ring-primary-green/20 outline-none transition-all"/>
        </div>

        <!-- Bind Submit Button -->
        <button onclick="handleBindSubmit()" class="w-full bg-line-green hover:bg-line-green-hover text-white py-3.5 rounded-xl font-bold text-base shadow-lg shadow-line-green/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.82 2 10.5c0 3.32 2.27 6.22 5.67 7.5-.23.83-.84 3.03-.96 3.48-.15.56.2.55.43.4.18-.12 2.87-1.95 4.04-2.75.92.17 1.86.27 2.82.27 5.52 0 10-3.82 10-8.5S17.52 2 12 2z"/></svg>
          確認綁定 LINE 帳號
        </button>

        <div class="text-center pt-2">
          <button onclick="switchAuthTab('register')" class="text-xs text-secondary-container hover:underline font-bold">
            若查無此帳號或尚未註冊？點此前往【建立會員帳號】 ➔
          </button>
        </div>
      </div>

      <!-- FORM 3: REGISTER（2026-10-10 主人指定：LINE 首次登入時填寫的資料畫面） -->
      <div id="form-register" class="hidden space-y-4 pt-2">
        <input type="hidden" id="reg-line-id" />
        <input type="hidden" id="reg-avatar-url" />

        <div>
          <label class="block text-xs font-bold text-on-surface-variant mb-1.5">姓名 *</label>
          <input type="text" id="reg-name" placeholder="請輸入姓名" class="w-full bg-surface-container-high border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface focus:border-primary-green focus:ring-2 focus:ring-primary-green/20 outline-none transition-all"/>
        </div>

        <div>
          <label class="block text-xs font-bold text-on-surface-variant mb-1.5">手機 *</label>
          <input type="tel" id="reg-phone" placeholder="請輸入手機號碼" class="w-full bg-surface-container-high border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface focus:border-primary-green focus:ring-2 focus:ring-primary-green/20 outline-none transition-all"/>
        </div>

        <div>
          <label class="block text-xs font-bold text-on-surface-variant mb-1.5">寄送地址 *</label>
          <textarea id="reg-address" rows="2" placeholder="請輸入收件地址" class="w-full bg-surface-container-high border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface focus:border-primary-green focus:ring-2 focus:ring-primary-green/20 outline-none transition-all resize-none"></textarea>
        </div>

        <!-- Register Submit Button -->
        <button onclick="handleRegisterSubmit()" class="w-full bg-line-green hover:bg-line-green-hover text-white py-3.5 rounded-xl font-bold text-base shadow-lg shadow-line-green/20 active:scale-[0.99] transition-all">
          完成註冊並登入
        </button>

        <div class="text-center pt-2">
          <a href="/" class="text-xs text-on-surface-variant hover:text-primary-green font-bold hover:underline">
            返回首頁 ➔
          </a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="p-4 text-center font-label-caps text-xs text-on-surface-variant border-t border-outline-variant">
      © 2026 展夢.飛翔 版權所有
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tab = urlParams.get('tab');
      const lineId = urlParams.get('line_id');
      const name = urlParams.get('name');
      const avatar = urlParams.get('avatar');

      // 2026-10-10 主人指定：登入頁只保留 LINE。
      // LINE 未註冊過的使用者，授權回來會帶 tab=register，直接打開「填寫資料」畫面。
      if (lineId) {
        document.getElementById('reg-line-id').value = lineId;
        document.getElementById('bind-line-id').value = lineId;
      }
      if (avatar) {
        document.getElementById('reg-avatar-url').value = avatar;
        document.getElementById('bind-avatar-url').value = avatar;
      }
      if (name) {
        document.getElementById('reg-name').value = name;
      }
      if (tab === 'register' || lineId) {
        document.getElementById('line-bind-banner').classList.remove('hidden');
        switchAuthTab('register');
      }
    });

    function switchAuthTab(tab) {
      const btnLogin = document.getElementById('btn-tab-login');
      const btnBind = document.getElementById('btn-tab-bind');
      const btnReg = document.getElementById('btn-tab-register');

      const formLogin = document.getElementById('form-login');
      const formBind = document.getElementById('form-bind');
      const formReg = document.getElementById('form-register');

      const title = document.getElementById('auth-card-title');
      const subtitle = document.getElementById('auth-card-subtitle');

      // Reset
      btnLogin.className = "flex-1 py-2 rounded-lg text-on-surface-variant hover:text-primary-green transition-all";
      btnBind.className = "hidden flex-1 py-2 rounded-lg text-on-surface-variant hover:text-primary-green transition-all";
      btnReg.className = "flex-1 py-2 rounded-lg text-on-surface-variant hover:text-primary-green transition-all";

      formLogin.classList.add('hidden');
      formBind.classList.add('hidden');
      formReg.classList.add('hidden');

      if (tab === 'login') {
        btnLogin.className = "flex-1 py-2 rounded-lg bg-primary-fixed text-on-primary-fixed font-bold transition-all";
        formLogin.classList.remove('hidden');
        title.textContent = "會員登入";
        subtitle.textContent = "使用 LINE 帳號快速登入";
      } else if (tab === 'bind') {
        btnBind.className = "flex-1 py-2 rounded-lg bg-line-green text-white font-bold transition-all";
        formBind.classList.remove('hidden');
        title.textContent = "LINE 帳號綁定";
        subtitle.textContent = "輸入您已註冊之手機電話/帳號完成 LINE 帳號連結";
      } else {
        btnReg.className = "flex-1 py-2 rounded-lg bg-primary-fixed text-on-primary-fixed font-bold transition-all";
        formReg.classList.remove('hidden');
        title.textContent = "填寫基本資料";
        subtitle.textContent = "第一次使用 LINE 登入，請填寫以下資料完成註冊";
      }
    }

    async function handleLoginSubmit() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();

      if (!username || !password) {
        alert('請輸入電話號碼/帳號與密碼！');
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password })
        });
        const json = await res.json();
        if (json.status === 'success') {
          const roleMap = { admin: '管理員', assistant_coach: '助理教練', user: '一般使用者' };
          alert(`登入成功！歡迎回來，${json.user.name}（${roleMap[json.user.role] || json.user.role}）`);
          
          if (json.user.role === 'admin' || json.user.role === 'assistant_coach') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/';
          }
        } else {
          alert(json.message || '帳號或密碼錯誤');
        }
      } catch (e) {
        console.error(e);
        alert('登入連線失敗');
      }
    }

    async function handleBindSubmit() {
      const username = document.getElementById('bind-username').value.trim();
      const password = document.getElementById('bind-password').value.trim();
      const lineId = document.getElementById('bind-line-id').value;
      const avatarUrl = document.getElementById('bind-avatar-url').value;

      if (!username || !password) {
        alert('請輸入您原有的手機電話/帳號與密碼進行綁定！');
        return;
      }

      try {
        const res = await fetch('/api/line/bind-account', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password, line_id: lineId, avatar_url: avatarUrl })
        });
        const json = await res.json();
        if (json.status === 'success') {
          alert('🎉 LINE 帳號綁定成功！即刻為您自動進行登入。');
          window.location.href = '/';
        } else {
          alert(json.message || '綁定失敗！');
          // 若查詢不到該帳號，引導切換至【建立會員帳號】畫面
          if (confirm('查無此帳號或密碼錯誤，是否要前往【建立會員帳號】？')) {
            switchAuthTab('register');
          }
        }
      } catch (e) {
        console.error(e);
        alert('連線失敗');
      }
    }

    async function handleRegisterSubmit() {
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const address = document.getElementById('reg-address').value.trim();
      const lineId = document.getElementById('reg-line-id').value;
      const avatarUrl = document.getElementById('reg-avatar-url').value;

      if (!lineId) {
        alert('請先使用 LINE 帳號登入，再填寫註冊資料。');
        switchAuthTab('login');
        return;
      }

      if (!name || !phone || !address) {
        alert('請填寫姓名、手機與寄送地址！');
        return;
      }

      // 2026-10-10 主人指定：只用 LINE 登入，帳號與密碼由系統自動產生，使用者不需要填。
      const username = 'line_' + lineId;
      const autoPassword = 'Ln!' + Math.random().toString(36).slice(2) + Date.now().toString(36);

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            name,
            username,
            password: autoPassword,
            phone,
            address,
            line_id: lineId,
            avatar_url: avatarUrl
          })
        });
        const json = await res.json();
        if (json.status === 'success') {
          alert('🎉 註冊成功！即刻為您自動登入。');
          document.getElementById('login-username').value = username;
          document.getElementById('login-password').value = autoPassword;
          handleLoginSubmit();
        } else {
          alert(json.message || '註冊失敗');
        }
      } catch (e) {
        console.error(e);
        alert('註冊連線失敗');
      }
    }

    async function handleLineLogin() {
      try {
        const res = await fetch('/api/line/login-url');
        const json = await res.json();
        if (json.status === 'success' && json.url) {
          window.location.href = json.url;
        } else {
          alert("LINE Login 尚未設定 Channel ID，請先在 Railway 變數中加入 LINE_LOGIN_CHANNEL_ID！");
        }
      } catch (e) {
        alert("連線至 LINE 登入服務失敗");
      }
    }
  </script>

</body>
</html>
